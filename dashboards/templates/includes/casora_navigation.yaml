type: conditional
conditions:
  - condition: screen
    media_query: "(min-width: 769px) and (min-height: 501px) and (hover: hover) and (pointer: fine)"

card:
  type: custom:casora-nav
  variant: desktop
  routes:
    - url: /dashboard-casora/home
      label: Home
      icon: mdi:home-variant

    - url: /dashboard-casora/living-room
      label: Living Room
      icon: mdi:sofa
      badge:
        show: >
          [[[
            const _s = hass.states['input_text.casora_motion_living_room']?.state?.trim();
            return hass.states['input_boolean.casora_motion_badges']?.state === 'on'
              && !!_s && hass.states[_s]?.state === 'on';
          ]]]
        color: '#ffd700'

    - url: /dashboard-casora/kitchen
      label: Kitchen
      icon: mdi:fridge

    - url: /dashboard-casora/bedroom
      label: Bedroom
      icon: mdi:bed-king
      badge:
        show: >
          [[[
            const _s = hass.states['input_text.casora_motion_bedroom']?.state?.trim();
            return hass.states['input_boolean.casora_motion_badges']?.state === 'on'
              && !!_s && hass.states[_s]?.state === 'on';
          ]]]
        color: '#ffd700'

    - label: Scenes
      icon: mdi:layers
      menu: scenes
