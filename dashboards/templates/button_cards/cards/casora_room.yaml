          type: custom:button-card
          variables:
            color: '[[[ return variables.energy_color_1 ]]]'
            cost_entity: '[[[ return variables.energy_cost_1 ]]]'
            enabled: '[[[ return (window._casoraEnergyOn ? window._casoraEnergyOn(variables) : !!variables.energy_power_entity) && !!variables.energy_entity_1 ]]]'
            entity_cost_month: '[[[ return variables.energy_popup_power_1 ? variables.energy_popup_cost_month_1 : variables.energy_cost_month ]]]'
            entity_cost_today: '[[[ return variables.energy_popup_power_1 ? variables.energy_popup_cost_today_1 : variables.energy_cost_today ]]]'
            entity_power: '[[[ return variables.energy_popup_power_1 || variables.energy_power_entity ]]]'
