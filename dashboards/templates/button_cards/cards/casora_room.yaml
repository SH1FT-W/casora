    badges_lights:
      card:
        cards:
        - entity: |
            [[[
              const g = variables.light_entity_1 || variables.light_group_entity;
              const m = g ? hass.states[g]?.attributes?.entity_id : null;
              const expand = Array.isArray(m) && m.length > 0 && !variables.light_entity_2;
              return expand ? (m[0] || null) : (variables.light_entity_1 || null);
            ]]]
          template: casora_badge_light
          type: custom:button-card
          variables:
            enabled: |
              [[[
                const g = variables.light_entity_1 || variables.light_group_entity;
                const m = g ? hass.states[g]?.attributes?.entity_id : null;
                const expand = Array.isArray(m) && m.length > 0 && !variables.light_entity_2;
                if (expand) return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) && !!m[0];
                return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) && !!variables.light_entity_1;
              ]]]
        - entity: |
            [[[
              const g = variables.light_entity_1 || variables.light_group_entity;
              const m = g ? hass.states[g]?.attributes?.entity_id : null;
              const expand = Array.isArray(m) && m.length > 0 && !variables.light_entity_2;
              return expand ? (m[1] || null) : (variables.light_entity_2 || null);
            ]]]
          template: casora_badge_light
          type: custom:button-card
          variables:
            enabled: |
              [[[
                const g = variables.light_entity_1 || variables.light_group_entity;
