            return (variables.casora_ui_managed && !variables.time_entity) ? 'none' : 'block';
          ]]]
      - position: fixed
      - z-index: 10
      - pointer-events: auto
      - --mdc-ripple-press-opacity: 0
      - -webkit-tap-highlight-color: transparent
      - --ha-card-padding: 0px
      weather:
      - grid-area: weather
      - display: |
          [[[
            const mm = (q) => (window.matchMedia ? window.matchMedia(q).matches : false);
            const isPhonePortrait =
              (mm('(pointer: coarse)') || mm('(hover: none)')) &&
              mm('(max-width: 767px)') &&
              mm('(orientation: portrait)');
            const wx = window.casoraWx ? window.casoraWx(variables, 'entity') : (variables.weather_entity || '');
            const wxt = window.casoraWx ? window.casoraWx(variables, 'temp') : (variables.weather_temp_sensor || '');
            const hasData = !!(wx || wxt);
            const ok = !!wx && hasData;
            return (isPhonePortrait && ok) ? 'block' : 'none';
          ]]]
      - position: absolute
      - top: |
          calc(
            var(--hero-top)
            + var(--hero-room-name-size-current, 38px) * var(--hero-room-name-line-height-current, 1.1)
            - var(--hero-weather-title-size, 16px)
            - var(--hero-weather-sub-size, 13px) * 1.1
            - 1px
            + var(--weather-mobile-badge-nudge, 0px))
      - left: var(--hero-gutter, var(--page-gutter-mobile, 11px))
      - right: calc(var(--hero-gutter, var(--page-gutter-mobile, 11px)) + 6px)
      - z-index: 10
      - text-align: right
      - justify-self: end
      - margin: 0
      - width: auto
      - max-width: none
      - overflow: visible
      - pointer-events: auto
    grid: []
    name:
    - grid-area: n
    - color: var(--primary-text-color)
    - opacity: 1
    - font-size: var(--hero-room-name-size-current, clamp(48px, 6vw + 12px, 100px))
    - letter-spacing: var(--hero-room-name-letter-spacing-current, -2px)
    - font-weight: 700
    - justify-self: start
    - padding-left: 0
    - line-height: var(--hero-room-name-line-height-current, 1.2)
    - margin-left: var(--hero-room-name-margin-left-current, 0px)
    - overflow: visible
  tap_action:
    action: none
  template:
  - casora_default
  - casora_shared
