# Room
casora_room:
  classes:
    card:
    - casora-room
  custom_fields:
    assist:
      card:
        template: casora_assist_button
        type: custom:button-card
        variables:
          shown: '[[[ return variables.show_assist !== false && ((hass && hass.config && hass.config.components) || []).includes("conversation") ]]]'
    badges:
      card:
        card_mod:
          style: |
            ha-card {
              overflow: visible !important;
            }
        cards:
        - template: casora_badge_security_group
          type: custom:button-card
          variables:
            alarm_entity: '[[[ return variables.security_entity_1 ]]]'
            doors_entity: '[[[ return variables.security_entity_2 ]]]'
            enabled: '[[[ return (variables.show_security!==false&&(!!variables.security_lock_entity||!!variables.security_entity_1||!!(variables.security_locks||[]).length||!!(variables.security_cameras||[]).length)) ]]]'
            lock_entity: '[[[ return variables.security_lock_entity ]]]'
            lock_entity_2: '[[[ return variables.security_lock_entity_2 ]]]'
            locks: '[[[ return variables.security_locks || [] ]]]'
        - template: casora_badge_climate_group
          type: custom:button-card
          variables:
            climate_entity: '[[[ return variables.climate_entity_1 ]]]'
            climate_entity_2: '[[[ return variables.climate_entity_2 ]]]'
            climate_entity_3: '[[[ return variables.climate_entity_3 ]]]'
            enabled: '[[[ return (variables.show_climate!==false&&(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor)) && !variables.show_climate_inline ]]]'
            humidity_sensor: '[[[ return variables.humidity_sensor ]]]'
            quality_sensor: '[[[ return variables.quality_sensor ]]]'
            temp_sensor: '[[[ return variables.temp_sensor_1 ]]]'
            temp_sensor_2: '[[[ return variables.temp_sensor_2 ]]]'
            temp_sensor_3: '[[[ return variables.temp_sensor_3 ]]]'
            temp_sensor_4: '[[[ return variables.temp_sensor_4 ]]]'
            temp_sensor_5: '[[[ return variables.temp_sensor_5 ]]]'
            temp_unit: '[[[ return variables.temp_unit ]]]'
        - entity: '[[[ return variables.temp_sensor_1 ]]]'
          template: casora_badge_temp
          type: custom:button-card
          variables:
            enabled: '[[[ return !!((variables.show_climate!==false&&(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor)) && variables.show_climate_inline && variables.temp_sensor_1) ]]]'
            entity_humidity: '[[[ return variables.aqi_entity_humidity ]]]'
            entity_quality: '[[[ return variables.quality_sensor ]]]'
            entity_temp: '[[[ return variables.aqi_entity_temp ]]]'
            gauge: true
            gauge_keep_bg: true
            room_name: '[[[ return variables.aqi_room_name || this._config?.name || hass?.config?.location_name || "" ]]]'
            sensors: |-
              [[[
                return [variables.aqi_entity_pm25,variables.aqi_entity_pm10,variables.aqi_entity_voc,variables.aqi_entity_co2].filter(Boolean);
              ]]]
            temp_unit: '[[[ return variables.temp_unit ]]]'
        - entity: '[[[ return variables.humidity_sensor ]]]'
          template: casora_badge_humidity
          type: custom:button-card
          variables:
            enabled: '[[[ return !!((variables.show_climate!==false&&(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor)) && variables.show_climate_inline && variables.humidity_sensor) ]]]'
            entity_humidity: '[[[ return variables.aqi_entity_humidity ]]]'
            entity_quality: '[[[ return variables.quality_sensor ]]]'
            entity_temp: '[[[ return variables.aqi_entity_temp ]]]'
            gauge: true
            gauge_keep_bg: true
            room_name: '[[[ return variables.aqi_room_name || this._config?.name || hass?.config?.location_name || "" ]]]'
            sensors: |-
              [[[
                return [variables.aqi_entity_pm25,variables.aqi_entity_pm10,variables.aqi_entity_voc,variables.aqi_entity_co2].filter(Boolean);
              ]]]
        - entity: '[[[ return variables.quality_sensor ]]]'
          template: casora_badge_air_quality
          type: custom:button-card
          variables:
            enabled: '[[[ return !!((variables.show_climate!==false&&(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor)) && variables.show_climate_inline && variables.quality_sensor) ]]]'
            entity_humidity: '[[[ return variables.aqi_entity_humidity ]]]'
            entity_quality: '[[[ return variables.quality_sensor ]]]'
            entity_temp: '[[[ return variables.aqi_entity_temp ]]]'
            gauge: true
            gauge_keep_bg: true
            room_name: '[[[ return variables.aqi_room_name || this._config?.name || hass?.config?.location_name || "" ]]]'
            sensors: |-
              [[[
                return [variables.aqi_entity_pm25,variables.aqi_entity_pm10,variables.aqi_entity_voc,variables.aqi_entity_co2].filter(Boolean);
              ]]]
        - template: casora_badge_light_group
          type: custom:button-card
          variables:
            enabled: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ]]]'
            entity_1: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_1 : null ]]]'
            entity_10: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_10 : null ]]]'
            entity_2: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_2 : null ]]]'
            entity_3: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_3 : null ]]]'
            entity_4: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_4 : null ]]]'
            entity_5: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_5 : null ]]]'
            entity_6: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_6 : null ]]]'
            entity_7: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_7 : null ]]]'
            entity_8: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_8 : null ]]]'
            entity_9: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_entity_9 : null ]]]'
            light_group_entity: '[[[ return (variables.show_lights!==false&&(!!variables.light_entity_1||!!variables.light_group_entity)) ? variables.light_group_entity : null ]]]'
        - template: casora_badge_presence_group
          type: custom:button-card
          variables:
            enabled: '[[[ return variables.show_people!==false && !!variables.presence_entity_1 && !!variables.presence_entity_2 ]]]'
            entity_1: '[[[ return variables.presence_entity_1 ]]]'
            entity_2: '[[[ return variables.presence_entity_2 ]]]'
            entity_3: '[[[ return variables.presence_entity_3 ]]]'
            entity_4: '[[[ return variables.presence_entity_4 ]]]'
        - entity: '[[[ return variables.presence_entity_1 ]]]'
          template: casora_badge_presence
          type: custom:button-card
          variables:
            enabled: '[[[ return variables.show_people!==false && !!(!!variables.presence_entity_1 && variables.presence_entity_1 && !variables.presence_entity_2) ]]]'
        - template: casora_badge_media_group
          type: custom:button-card
          variables:
            enabled: '[[[ return (variables.show_media!==false&&!variables.show_now_playing&&!!variables.media_player_1) ]]]'
            entity_1: '[[[ return !!variables.media_player_1 ? variables.media_player_1 : null ]]]'
            entity_10: '[[[ return !!variables.media_player_7 ? variables.media_player_7 : null ]]]'
            entity_11: '[[[ return !!variables.media_player_8 ? variables.media_player_8 : null ]]]'
            entity_12: '[[[ return !!variables.media_player_9 ? variables.media_player_9 : null ]]]'
            entity_13: '[[[ return !!variables.media_player_10 ? variables.media_player_10 : null ]]]'
            entity_2: '[[[ return !!variables.media_player_2 ? variables.media_player_2 : null ]]]'
            entity_3: '[[[ return !!variables.media_player_3 ? variables.media_player_3 : null ]]]'
            entity_4: '[[[ return !!variables.media_player_4 ? variables.media_player_4 : null ]]]'
            entity_6: '[[[ return !!variables.psn_1 ? variables.psn_1 : null ]]]'
            entity_7: '[[[ return !!variables.psn_2 ? variables.psn_2 : null ]]]'
            entity_8: '[[[ return !!variables.media_player_5 ? variables.media_player_5 : null ]]]'
            entity_9: '[[[ return !!variables.media_player_6 ? variables.media_player_6 : null ]]]'
            pause_timeout_minutes: '[[[ return variables.pause_timeout_minutes ]]]'
            pc_count: '[[[ const P = window._casoraPCSources?.(states, variables) || {}; return (P.discord ? 1 : 0) + (P.steam ? 1 : 0) ]]]'
        - entity: '[[[ return variables.energy_power_entity ]]]'
          template: casora_badge_energy_group
          type: custom:button-card
          variables:
            enabled: |
              [[[
                return window._casoraEnergyOn
                  ? window._casoraEnergyOn(variables)
                  : (variables.show_energy!==false && !!variables.energy_power_entity);
              ]]]
            entity_cost_month: '[[[ return variables.energy_cost_month ]]]'
            entity_cost_today: '[[[ return variables.energy_cost_today ]]]'
            entity_power: '[[[ return variables.energy_power_entity ]]]'
            entity_usage_month: '[[[ return variables.energy_usage_month ]]]'
            entity_usage_today: '[[[ return variables.energy_usage_today ]]]'
            home_power_entity: '[[[ return variables.energy_home_power_entity || variables.energy_power_entity ]]]'
            power_entity: '[[[ return variables.energy_power_entity ]]]'
            room_name: '[[[ return variables.room_name || variables.aqi_room_name ]]]'
        - template: casora_badge_scene_group
          type: custom:button-card
          variables:
            enabled: '[[[ return variables.show_scenes === true && !!(variables.scene_entities || []).length ]]]'
            scene_entities: '[[[ return variables.scene_entities || [] ]]]'
        layout:
          align-items: center
          grid-auto-columns: max-content
          grid-auto-flow: column
          grid-column-gap: var(--badge-gap-current, var(--badge-gap, 10px))
          grid-template-columns: none
          justify-content: start
          justify-items: start
        layout_type: custom:grid-layout
        type: custom:layout-card
    badges_climate:
      card:
        cards:
        - entity: '[[[ return variables.temp_sensor_1 ]]]'
          template: casora_badge_temp
          type: custom:button-card
          variables:
            enabled: '[[[ return (variables.show_climate!==false&&(!!variables.climate_entity_1||!!variables.temp_sensor_1||!!variables.humidity_sensor||!!variables.quality_sensor)) && !!variables.temp_sensor_1 ]]]'
            entity_humidity: '[[[ return variables.aqi_entity_humidity ]]]'
