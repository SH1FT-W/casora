            entity_usage_today: '[[[ return variables.energy_popup_power_1 ? variables.energy_popup_today_1 : variables.energy_usage_today ]]]'
            gauge_max: '[[[ return variables.energy_gauge_max_1 ]]]'
            label: '[[[ return variables.energy_label_1 ]]]'
