casora_cover:
  template: [casora_entity]

  variables:
    mobile_filter_category: climate

  show_entity_picture: true
  show_icon: false
  show_name: true
  show_state: true
  name: Cover

  tap_action:
    action: more-info

  hold_action:
    action: toggle

  icon_tap_action:
    action: call-service
    service: |
      [[[
        const s = (entity?.state || '').toLowerCase();
        return ['open', 'opening'].includes(s) ? 'cover.close_cover' : 'cover.open_cover';
      ]]]
    service_data:
      entity_id: '[[[ return entity?.entity_id ]]]'

  entity_picture: |
    [[[
      const s = (entity?.state || '').toLowerCase();
      const k = window.casoraCoverKind
        ? window.casoraCoverKind(entity?.attributes?.device_class, entity?.entity_id)
        : { open: 'curtain-open', closed: 'curtain-closed' };
      return ['open', 'opening'].includes(s)
        ? window.casoraIconUrl(variables.icon_open || k.open)
        : window.casoraIconUrl(variables.icon_closed || k.closed);
    ]]]

  state:
    - operator: template
      value: |
        [[[
          const s = (entity?.state || '').toLowerCase();
          return ['open', 'opening'].includes(s);
        ]]]
      styles:
        card:
          - --casora-icon-svg-url: |
              [[[
                const s = (entity?.state || '').toLowerCase();
                const k = window.casoraCoverKind
                  ? window.casoraCoverKind(entity?.attributes?.device_class, entity?.entity_id)
                  : { open: 'curtain-open', closed: 'curtain-closed' };
                return ['open', 'opening'].includes(s)
                  ? `url('${window.casoraIconUrl(variables.icon_open || k.open)}')`
                  : `url('${window.casoraIconUrl(variables.icon_closed || k.closed)}')`;
              ]]]
          - --casora-icon-use-mask: "1"
          - --casora-icon-color-current: "var(--casora-popup-primary-color, #00c3d0)"
          - --casora-icon-circle-bg: var(--casora-icon-color-current)
        img_cell:
          - opacity: "1 !important"
          - filter: none !important
        entity_picture:
          - opacity: "1 !important"
          - filter: none !important

  styles:
    card:
      - --casora-icon-mask-image: |
          [[[
            const s = (entity?.state || '').toLowerCase();
            const k = window.casoraCoverKind
              ? window.casoraCoverKind(entity?.attributes?.device_class, entity?.entity_id)
              : { open: 'curtain-open', closed: 'curtain-closed' };
            return ['open', 'opening'].includes(s)
              ? `url('${window.casoraIconUrl(variables.icon_open || k.open)}')`
              : `url('${window.casoraIconUrl(variables.icon_closed || k.closed)}')`;
          ]]]