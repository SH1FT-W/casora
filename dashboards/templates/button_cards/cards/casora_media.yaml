# Media Card
casora_media:
  entity_picture: |
    [[[
      if (variables.has_artwork && variables.art_url) return variables.art_url;
      const icon = variables?.icon;
      if (icon === 'ps5') {
        if (variables.is_active) {
          return `${window.casoraIconUrl('ps5')}#s=${encodeURIComponent(entity.last_changed || '')}`;
        }
        return window.casoraIconUrl('ps5_off');
      }
      if (icon) return window.casoraIconUrl(icon);
      return window.casoraIconUrl('speaker');
    ]]]
  extra_styles: |
    #img-cell {
      background: var(--casora-media-icon-bg, var(--casora-icon-circle-bg, rgba(0,0,0,0.20))) !important;
      width: var(--casora-icon-circle-size, 44px) !important;
      height: var(--casora-icon-circle-size, 44px) !important;
      /* Forces a square whichever rule wins on each axis. */
      aspect-ratio: 1 / 1 !important;
    }

    :host #img-cell img {
      width: var(--casora-media-icon-size, var(--casora-icon-mask-scale, 60%)) !important;
      height: var(--casora-media-icon-size, var(--casora-icon-mask-scale, 60%)) !important;
      max-width: var(--casora-media-icon-size, var(--casora-icon-mask-scale, 60%)) !important;
      max-height: var(--casora-media-icon-size, var(--casora-icon-mask-scale, 60%)) !important;
      aspect-ratio: 1 / 1 !important;
      object-fit: var(--casora-media-icon-fit, contain) !important;
      transition: opacity 0.3s ease, width 0.3s ease, height 0.3s ease !important;
    }
  hold_action:
    action: more-info
    entity: '[[[ return entity?.entity_id ]]]'
  icon_tap_action:
    action: |
      [[[
        const s = String(entity?.state || '').toLowerCase();
        if (s === 'unavailable' || s === 'unknown') return 'none';
        const feats = Number(entity?.attributes?.supported_features || 0);
        return (s === 'off' ? (feats & 128) : (feats & 256)) ? 'call-service' : 'none';
      ]]]
    service: |
      [[[
        return String(entity?.state || '').toLowerCase() === 'off'
          ? 'media_player.turn_on'
          : 'media_player.turn_off';
      ]]]
    service_data: |
      [[[ return { entity_id: entity?.entity_id }; ]]]
  show_empty: false
  show_entity_picture: true
  show_icon: false
  show_last_changed: false
  state_display: |-
    [[[
      const sRaw = String(entity?.state || "");
      const s    = sRaw.toLowerCase();
      const a    = entity?.attributes || {};
      const cap  = (x) => (x ? x.charAt(0).toUpperCase() + x.slice(1) : "");
      const esc  = (t) => String(t ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .trim();
      if (s === "playing") {
        const id       = entity?.entity_id || "";
        const friendly = (a.friendly_name || "").toLowerCase();
        const type   = String(a.media_content_type || "").toLowerCase();
        const title  = (a.media_title || a.title || "").trim();
        const artist =
          (a.media_artist || a.artist || a.media_album_artist || "").trim();
        const app    = (a.app_name || "").trim();
        const source = (a.source || a.media_channel || "").trim();
        const isMusic =
          type === "music" ||
          id.includes("spotify") ||
          (!!artist && !["movie","video","tvshow"].includes(type));
        let label = "";
        if (isMusic) {
          if (artist && title) label = `${artist} - ${title}`;
          else label = title || artist || app || source || 'Wiedergabe';
        } else {
          label = title || app || source || 'Wiedergabe';
        }
        const isSonos = id.includes("sonos") || friendly.includes("sonos");
        const bareInputs = ["tv","hdmi","arc","hdmi arc","optical","line-in","line in"];
        let looksLikeBareInput = false;
        if (isSonos) {
          const tLow = title.toLowerCase();
          const sLow = source.toLowerCase();
          if (
            title && (
              bareInputs.includes(tLow) ||
              (source && tLow === sLow)
            )
          ) {
            looksLikeBareInput = true;
          }
        }
        const hasRichMeta =
          !!(a.media_artist || a.media_album_artist || a.media_series_title || a.media_episode_title);
        const mediaTypes = ["music","movie","video","tvshow","game"];
        const fromRichApp =
          /youtube|netflix|hulu|disney|max|prime|spotify|apple tv|apple music|paramount|peacock/i
            .test(app);
        const isRichPlayback = !looksLikeBareInput && (
          hasRichMeta ||
          mediaTypes.includes(type) ||
          fromRichApp
        );
        if (!isRichPlayback) return esc(label) || 'Wiedergabe';
        return `<span class="casora-media-state">${esc(label)}</span>`;
      }
      const M = { on: 'An', off: 'Aus', idle: 'Inaktiv', paused: 'Pausiert', playing: 'Wiedergabe', buffering: 'Lädt', standby: 'Standby', unavailable: 'Nicht verfügbar', unknown: 'Unbekannt' };
      if (M[s]) return M[s];
      return s ? cap(s) : "Aus";
    ]]]
  styles:
    card:
    - --casora-progress-track-color: rgba(0,0,0,0.12)
    - --casora-media-icon-size: '[[[ return variables.has_artwork ? "100%" : "var(--casora-icon-mask-scale, 60%)"; ]]]'
    - --casora-media-icon-fit: '[[[ return variables.has_artwork ? "cover" : "contain"; ]]]'
    - --casora-icon-mask-image: |
        [[[
          const icon = variables.icon;
          if (icon === 'ps5') return `url('${window.casoraIconUrl(variables.is_active ? 'ps5' : 'ps5_off')}')`;
          return `url('${window.casoraIconUrl(icon || 'speaker')}')`;
        ]]]
    - --casora-media-icon-bg: |
        [[[
          if (variables.has_artwork) return 'rgba(255,255,255,0.10)';
          if (!variables.is_active) return 'var(--casora-icon-circle-bg, rgba(0,0,0,0.20))';
          if (variables.icon === 'ps5') return 'rgba(10,10,10,0.85)';
          return 'var(--casora-icon-color-current)';
        ]]]
    - --casora-icon-circle-shadow: |
        [[[
          if (!variables.has_artwork) return '0 2px 6px rgba(0,0,0,0.04)';
          return '0 3px 12px rgba(0,0,0,0.15)';
        ]]]
  tap_action:
    action: |
      [[[
        return window.casoraPopupAction ? window.casoraPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return entity?.entity_id ]]]'
    haptic: light
    casora_popup:
      content: |-
        [[[
          const UI = window._casoraUI;
          if (!UI || !entity) return { type: 'vertical-stack', cards: [] };
          const id = entity?.entity_id;
          const reg = hass.entities || {};
          const devId = reg[id]?.device_id;
          const areaId = reg[id]?.area_id || (devId ? hass.devices?.[devId]?.area_id : null);
          const roomName = variables.room_name || (areaId ? hass.areas?.[areaId]?.name : null) || null;

          const uiCard = {
            type: 'custom:button-card',
            entity: id,
            triggers_update: [id].concat(variables.volume_entity ? [variables.volume_entity] : []),
            variables: { room_name: roomName, icon: variables.icon || null, volume_entity: variables.volume_entity || null },
            card_mod: { style:
              '\n:host { --ha-card-backdrop-filter: none !important; --ha-card-background: transparent !important; --card-background-color: transparent !important; --ha-card-box-shadow: none !important; --ha-card-border-width: 0px !important; }'
              + '\nha-card::before, ha-card::after, #card::before, #card::after, #container::before, #container::after { display: none !important; }'
              + '\nha-card { will-change: auto !important; }'
              + '\n@media (max-width: 600px) { ha-card { padding-left: 14px !important; padding-right: 14px !important; } }'
            },
            tap_action: { action: 'none' },
            hold_action: { action: 'none' },
            show_icon: false, show_name: false, show_label: false, show_state: false,
            styles: {
              card: [
                { background: 'transparent' }, { border: 'none' }, { 'box-shadow': 'none' },
                { padding: '6px 26px 22px 26px' },
              ],
              grid: [
                { 'grid-template-areas': '"body"' },
                { 'grid-template-columns': '1fr' },
              ],
              custom_fields: { body: [{ 'justify-self': 'stretch' }, { 'min-width': '0' }] },
            },
            custom_fields: { body: "[[[\n  const UI = window._casoraUI;\n  if (!UI || !entity) return '';\n  const T = UI.tokens;\n  const esc = UI.esc;\n  const id = entity?.entity_id;\n  const a = entity?.attributes || {};\n  const st = entity?.state;\n  const F = a.supported_features || 0;\n  const has = (b) => (F & b) === b;\n  /* Popup-Standard (24.09.2026): part = hero | ctl (breit), ohne part alles. */\n  const P = variables.part;\n  const svc = (service, data) => esc(JSON.stringify({ domain: 'media_player', service: service, data: data || {}, target: { entity_id: id } }));\n  const ic = (n) => (typeof window.casoraIconUrl === 'function') ? window.casoraIconUrl(n) : '/casora_assets/icons/' + n + '.svg';\n  const mask = (n, size, color) => '<div style=\"width:' + size + 'px;height:' + size + 'px;background-color:' + (color || 'currentColor') + ';'\n    + \"-webkit-mask:url('\" + ic(n) + \"') center / contain no-repeat;mask:url('\" + ic(n) + \"') center / contain no-repeat;\\\"></div>\";\n\n  const off = st === 'off' || st === 'unavailable' || st === 'unknown';\n  const active = st === 'playing' || st === 'paused' || st === 'buffering';\n  const stateMap = { playing: 'Wiedergabe', paused: 'Pausiert', buffering: 'L\u00e4dt', idle: 'Inaktiv', on: 'An', off: 'Aus', standby: 'Standby', unavailable: 'Nicht verf\u00fcgbar', unknown: 'Unbekannt' };\n  const stateTxt = stateMap[st] || st;\n\n  const title  = active ? (a.media_title || a.app_name || a.source || stateTxt) : stateTxt;\n  const artist = a.media_artist || a.media_album_artist || a.media_series_title || '';\n  const subBits = [];\n  if (active) {\n    if (artist) subBits.push(artist);\n    else if (a.media_album_name) subBits.push(a.media_album_name);\n    if (a.app_name && a.app_name !== title) subBits.push(a.app_name);\n    if (st === 'paused') subBits.push('Pausiert');\n  } else if (!off && a.source) subBits.push(a.source);\n\n  const pic = active ? (a.entity_picture_local || a.entity_picture) : null;\n  const devIcon = { playstation: 'ps5' }[variables.icon] || variables.icon || 'media';\n\n  let out = '<style>ha-card.disabled{pointer-events:auto!important;}'\n    + '.hm-wrap{font-family:' + T.font + ';display:flex;flex-direction:column;align-items:center;text-align:center;}'\n    + '.hm-lbl{font-size:15px;color:' + T.ink2 + ';margin-bottom:14px;}'\n    + '.hm-art{width:min(240px, 62vw);aspect-ratio:1/1;border-radius:16px;overflow:hidden;position:relative;'\n    +   'background:var(--casora-popup-row-fill, rgba(255,255,255,0.10));display:grid;place-items:center;'\n    +   'box-shadow:0 18px 40px -18px rgba(0,0,0,.85);' + (active && st !== 'playing' ? 'transform:scale(.92);' : '') + 'transition:transform .4s cubic-bezier(.36,0,.16,1);}'\n    + '.hm-art::after{content:\"\";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);pointer-events:none;}'\n    + '.hm-art img{width:100%;height:100%;object-fit:cover;display:block;}'\n    + '.hm-t{font-size:22px;font-weight:600;letter-spacing:-0.02em;color:' + T.ink + ';margin-top:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}'\n    + '.hm-s{font-size:15px;color:' + T.ink2 + ';margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:19px;}'\n    + '.hm-prog{width:100%;margin-top:16px;}'\n    + '.hm-track{height:5px;border-radius:999px;background:' + T.fill2 + ';overflow:hidden;}'\n    + '.hm-fill{height:100%;border-radius:999px;background:' + T.ink + ';}'\n    + '.hm-times{display:flex;justify-content:space-between;font-size:12px;color:' + T.ink3 + ';margin-top:5px;font-variant-numeric:tabular-nums;}'\n    + '.hm-ctl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:14px;color:' + T.ink + ';}'\n    + '.hm-b{border-radius:999px;display:grid;place-items:center;cursor:pointer;line-height:0;flex:none;'\n    +   'transition:background-color .16s ease, transform .12s ease;user-select:none;-webkit-user-select:none;}'\n    + '.hm-b > *{pointer-events:none;}'\n    + '.hm-b.sm{width:52px;height:52px;}'\n    + '.hm-b.lg{width:68px;height:68px;background:' + T.ink + ';color:var(--casora-popup-ui-on-ink, #000);}'\n    + '.hm-b.dis{opacity:.3;pointer-events:none;}'\n    + '.hm-b:active{transform:scale(.92);}'\n    + '@media (hover:hover){.hm-b.sm:hover{background:var(--casora-popup-seg-fill, rgba(255,255,255,0.12));}}'\n    + '.hm-vol{display:flex;align-items:center;gap:12px;width:100%;margin-top:22px;color:' + T.ink2 + ';'\n    +   'background:var(--casora-popup-row-fill, rgba(255,255,255,0.10));border-radius:var(--casora-popup-row-radius, 20px);padding:8px 10px;box-sizing:border-box;}'\n    + '.hm-vol .hm-b{width:40px;height:40px;}'\n    + '.hm-vol .hm-hit{flex:1;padding:14px 0;margin:-14px 0;cursor:pointer;touch-action:none;}'\n    + '.hm-vol .hm-track{height:6px;pointer-events:none;}'\n    + '.hm-vol .hm-hit.drag .hm-fill{transition:none;}'\n    + '.hm-vol .hm-fill{background:' + T.ink + ';}'\n    + '.hm-vol .pct{font-size:13px;min-width:36px;text-align:right;font-variant-numeric:tabular-nums;color:' + T.ink2 + ';}'\n    + '.hm-src-l{align-self:flex-start;font-size:15px;font-weight:600;letter-spacing:-0.01em;color:' + T.ink + ';margin:22px 4px 8px;}'\n    + '.hm-src{display:flex;gap:7px;overflow-x:auto;touch-action:pan-y;overscroll-behavior-x:contain;width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;}'\n    + '.hm-src::-webkit-scrollbar{display:none;}'\n    + '.hm-src .hui-sg{flex:none;font-size:14px;font-weight:500;padding:10px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;'\n    +   'background:var(--casora-popup-seg-fill, rgba(255,255,255,0.16));color:' + T.ink + ';}'\n    + '.hm-src .hui-sg.on{background:' + T.ink + ';color:var(--casora-popup-ui-on-ink, #000);}'\n    + '.hm-pw{width:100%;margin-top:22px;}'\n    + '</style>';\n\n  out += '<div class=\"hm-wrap\"' + (P === 'ctl' ? ' style=\"max-width:520px;margin:0 auto;\"' : '') + '>';\n  if (!P || P === 'hero') {\n  if (variables.room_name) out += '<div class=\"hm-lbl\">' + esc(variables.room_name) + '</div>';\n  out += '<div class=\"hm-art\">' + (pic\n      ? '<img src=\"' + esc(pic) + '\" alt=\"\" onerror=\"this.remove()\">'\n      : mask(devIcon, 88, off ? T.ink3 : T.ink2)) + '</div>';\n  out += '<div class=\"hm-t\">' + esc(title) + '</div>';\n  out += '<div class=\"hm-s\">' + esc(subBits.join(' \u00b7 ')) + '</div>';\n\n  /* Fortschritt: Balken l\u00e4uft per CSS bis zum Ende, Re-Render bei jedem Statuswechsel */\n  const dur = parseFloat(a.media_duration);\n  if (active && dur > 0) {\n    let pos = parseFloat(a.media_position) || 0;\n    if (st === 'playing' && a.media_position_updated_at) {\n      pos += (Date.now() - new Date(a.media_position_updated_at).getTime()) / 1000;\n    }\n    pos = Math.max(0, Math.min(dur, pos));\n    const pct = (pos / dur * 100).toFixed(2);\n    const mmss = (s) => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };\n    const anim = st === 'playing'\n      ? 'animation:hm-run ' + (dur - pos).toFixed(1) + 's linear forwards;' : '';\n    out += '<style>@keyframes hm-run{from{width:' + pct + '%}to{width:100%}}</style>'\n      + '<div class=\"hm-prog\"><div class=\"hm-track\"><div class=\"hm-fill\" style=\"width:' + pct + '%;' + anim + '\"></div></div>'\n      + '<div class=\"hm-times\"><span>' + (st === 'playing' ? '' : mmss(pos)) + '</span><span>' + mmss(dur) + '</span></div></div>';\n  }\n\n  }\n  if ((!P || P === 'ctl') && !off && (has(16) || has(32) || has(1) || has(16384))) {\n    const playing = st === 'playing';\n    const ppSvc = playing ? (has(1) ? 'media_pause' : 'media_stop') : 'media_play';\n    out += '<div class=\"hm-ctl\">'\n      + '<div class=\"hm-b sm' + (has(16) && active ? '' : ' dis') + '\" data-casora-svc=\"' + svc('media_previous_track') + '\">' + mask('skip_previous', 40) + '</div>'\n      + '<div class=\"hm-b lg\" data-casora-svc=\"' + svc(ppSvc) + '\">' + mask(playing ? 'pause' : 'play', 28, '#000') + '</div>'\n      + '<div class=\"hm-b sm' + (has(32) && active ? '' : ' dis') + '\" data-casora-svc=\"' + svc('media_next_track') + '\">' + mask('skip_next', 40) + '</div>'\n      + '</div>';\n  }\n\n  /* Lautst\u00e4rke: eigener Wert oder \u2013 falls der Player keinen meldet (Apple TV) \u2013\n     gespiegelter Wert aus variables.volume_entity (z.B. JBL-Bar per Automation) */\n  const vEnt = variables.volume_entity && states[variables.volume_entity];\n  const vMirror = vEnt && !isNaN(parseFloat(vEnt.state)) ? parseFloat(vEnt.state) / (parseFloat(vEnt.attributes?.max) || 100) : null;\n  const volLvl = a.volume_level != null ? a.volume_level : vMirror;\n  if ((!P || P === 'ctl') && !off && has(4) && volLvl != null) {\n    const v = Math.round(volLvl * 100);\n    const muted = !!a.is_volume_muted;\n    const clamp = (x) => Math.max(0, Math.min(1, Math.round(x * 100) / 100));\n    out += '<div class=\"hm-vol\">'\n      + (has(8)\n          ? '<div class=\"hm-b\" data-casora-svc=\"' + svc('volume_mute', { is_volume_muted: !muted }) + '\">' + mask(muted ? 'mute' : 'unmute', 20) + '</div>'\n          : '')\n      + '<div class=\"hm-b\" data-casora-svc=\"' + svc('volume_set', { volume_level: clamp(volLvl - 0.05) }) + '\">'\n      +   '<svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M4 10H16\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg></div>'\n      + '<div class=\"hm-hit\" ontouchstart=\"event.stopPropagation();var h=this,tr=h.firstElementChild,b=tr.getBoundingClientRect();var pc=function(x){return Math.max(0,Math.min(100,Math.round((x-b.left)/b.width*100)));};var paint=function(p){tr.firstElementChild.style.width=p+&quot;%&quot;;var l=h.parentNode.querySelector(&quot;.pct&quot;);if(l)l.textContent=p+&quot; %&quot;;};var send=function(p){document.querySelector(&quot;home-assistant&quot;).hass.callService(&quot;media_player&quot;,&quot;volume_set&quot;,{volume_level:p/100},{entity_id:&quot;' + id + '&quot;});};h.classList.add(&quot;drag&quot;);h._p=pc(event.touches[0].clientX);paint(h._p);\" ontouchmove=\"event.stopPropagation();if(event.cancelable)event.preventDefault();var h=this,tr=h.firstElementChild,b=tr.getBoundingClientRect();var pc=function(x){return Math.max(0,Math.min(100,Math.round((x-b.left)/b.width*100)));};var paint=function(p){tr.firstElementChild.style.width=p+&quot;%&quot;;var l=h.parentNode.querySelector(&quot;.pct&quot;);if(l)l.textContent=p+&quot; %&quot;;};var send=function(p){document.querySelector(&quot;home-assistant&quot;).hass.callService(&quot;media_player&quot;,&quot;volume_set&quot;,{volume_level:p/100},{entity_id:&quot;' + id + '&quot;});};h._p=pc(event.touches[0].clientX);paint(h._p);\" ontouchend=\"event.stopPropagation();if(event.cancelable)event.preventDefault();var h=this,tr=h.firstElementChild,b=tr.getBoundingClientRect();var pc=function(x){return Math.max(0,Math.min(100,Math.round((x-b.left)/b.width*100)));};var paint=function(p){tr.firstElementChild.style.width=p+&quot;%&quot;;var l=h.parentNode.querySelector(&quot;.pct&quot;);if(l)l.textContent=p+&quot; %&quot;;};var send=function(p){document.querySelector(&quot;home-assistant&quot;).hass.callService(&quot;media_player&quot;,&quot;volume_set&quot;,{volume_level:p/100},{entity_id:&quot;' + id + '&quot;});};h.classList.remove(&quot;drag&quot;);window._hmVT=Date.now();if(h._p!=null)send(h._p);\" ontouchcancel=\"this.classList.remove(&quot;drag&quot;)\" onclick=\"event.stopPropagation();if(Date.now()-(window._hmVT||0)<700)return;var h=this,tr=h.firstElementChild,b=tr.getBoundingClientRect();var pc=function(x){return Math.max(0,Math.min(100,Math.round((x-b.left)/b.width*100)));};var paint=function(p){tr.firstElementChild.style.width=p+&quot;%&quot;;var l=h.parentNode.querySelector(&quot;.pct&quot;);if(l)l.textContent=p+&quot; %&quot;;};var send=function(p){document.querySelector(&quot;home-assistant&quot;).hass.callService(&quot;media_player&quot;,&quot;volume_set&quot;,{volume_level:p/100},{entity_id:&quot;' + id + '&quot;});};var p=pc(event.clientX);paint(p);send(p);\">'\n      + '<div class=\"hm-track\"><div class=\"hm-fill\" style=\"width:' + (muted ? 0 : v) + '%\"></div></div></div>'\n      + '<div class=\"hm-b\" data-casora-svc=\"' + svc('volume_set', { volume_level: clamp(volLvl + 0.05) }) + '\">'\n      +   '<svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M4 10H16M10 4V16\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></svg></div>'\n      + '<div class=\"pct\">' + (muted ? 'Stumm' : v + ' %') + '</div>'\n      + '</div>';\n  }\n\n  out += '</div>';\n  return out;\n]]]" },
          };
          /* Apps/Quellen: statisch beim Öffnen gebaut, damit Positions-Updates des
             Players die Leiste nicht neu rendern (sonst springt/bricht das Wischen ab). */
          const a = entity?.attributes || {};
          const st = entity?.state;
          const offNow = st === 'off' || st === 'unavailable' || st === 'unknown';
          const srcs = Array.isArray(a.source_list) ? a.source_list : [];
          const cards = [uiCard];
          if (!offNow && ((a.supported_features || 0) & 2048) && srcs.length) {
            const esc = UI.esc, T = UI.tokens;
            const cur = a.app_name || a.source;
            const svc = (src) => esc(JSON.stringify({ domain: 'media_player', service: 'select_source', data: { source: src }, target: { entity_id: id } }));
            const list = cur && srcs.includes(cur) ? [cur].concat(srcs.filter((x) => x !== cur)) : srcs;
            const html = '<style>ha-card.disabled{pointer-events:auto!important;}'
