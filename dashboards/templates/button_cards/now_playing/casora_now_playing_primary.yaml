             definite height to resolve against and computed to nothing. A
             flex chain gives every link a real height without one. */
          @media (max-width: 768px) {
            /* The root cause, and why two attempts at the chain below did
               nothing: .surface is capped with max-height, never given one.
               A flex item in a content-sized container is itself
               content-sized, so every percentage under it resolved to
               nothing and the grid's `1fr` row had no slack to hand out.
               Same expression as its own max-height, as a height. */
            .surface {
              height: calc(100svh - var(--casora-popup-top, 112px) - 8px
                           - var(--safe-area-inset-bottom, 0px));
            }
            .content { display: flex; flex-direction: column; }
            /* A viewport unit, not a percentage. Every attempt to make this
               work by giving each link a definite height failed in the real
               DOM even though the chain measures correct in isolation - so
               the height is taken from the viewport directly and nothing has
               to resolve against a parent at all. 112 is the surface's top
               offset, 58 the header row, 8 the bottom gap. */
            .content .container {
              flex: 1 1 auto;
              min-height: calc(100svh - var(--casora-popup-top, 112px)
                               - 58px - 8px
                               - var(--safe-area-inset-bottom, 0px));
              display: flex; flex-direction: column; box-sizing: border-box;
            }
            /* The direct child AND anything HA wraps the card in: measured in
               isolation this chain resolves and the tiles land 8px off the
               bottom, so the only way it can still fail is a link in the real
               DOM that this does not name. */
            .content .container > *,
            .content .container hui-card,
            .content .container > * > * {
              flex: 1 1 auto; min-height: 0;
              display: flex; flex-direction: column;
            }
          }
          /* One measure for a control-plus-list popup, whatever the count.
             The rows are short and a wider sheet only stretches them; cover
             is the same shape and holds the same width. */
          --popup-min-width: 900px;
          --popup-max-width: 920px;
      title: '[[[ const e = states[variables.src?.entity]; return e?.attributes?.friendly_name || ''Medien''; ]]]'
    entity: '[[[ return variables.src?.entity || null; ]]]'
    haptic: light
  template:
  - casora_default
  variables:
    compact_controls: false
    entry_direction: corner
    extra_count: 0
    glass: true
    hold_src:
      force_eval: true
      value: |
        [[[
          const horizontal = variables.entry_direction === 'horizontal';

          if (!horizontal) return variables.src;

          window._casoraNPSlotState = window._casoraNPSlotState || {};
          const store = variables.slot_id
            ? (window._casoraNPSlotState[variables.slot_id] = window._casoraNPSlotState[variables.slot_id] || {})
            : this;

          const el = this;
          const scheduleRecheck = (ms) => {
            try { clearTimeout(store._npRecheckTimer); } catch (e) {}
            store._npRecheckTimer = setTimeout(() => {
              try {
                // Forcing a render with no state change takes BOTH steps, and neither alone works:
                //  1. button-card defines `set hass` with no getter, so the old `if (el.hass)`
                //     guard always read undefined and fell through to a bare requestUpdate().
                //  2. button-card's shouldUpdate() only passes on a _config change, a timer tick,
                //     or _hasAnEntityChanged - so a hass clone carrying identical states is
                //     rejected, and a bare requestUpdate() never reaches render().
                // _config is a reactive @state(), so marking it dirty is what actually gets the
                // templates re-evaluated. This is the path a paused tile depends on to lapse: it
                // emits no state change of its own, so nothing else will re-run the collector.
                const h = el._hass || el.hass;
                if (h) el.hass = Object.assign({}, h);
                if (typeof el.requestUpdate === 'function') el.requestUpdate('_config', undefined);
              } catch (e) {}
              try { window._casoraNPMobileRecheck?.(states); } catch (e) {}
            }, ms + 30);
          };

          const live = variables.src;
          const finish = (result) => {
            try { window._casoraNPSyncMobileRow?.(el, states); } catch (e) {}
            if (result && result.state === 'paused') {
              const until = Number(result.pauseUntil) || 0;
              const left = until ? (until - Date.now()) : 0;
              scheduleRecheck(until ? Math.min(30000, Math.max(1000, left + 150)) : 20000);
            }
            return result;
          };

          if (live) {
            store._npHoldSrc = live;
            store._npHoldAt = 0;
            return finish(live);
          }

          if (!store._npHoldSrc) return finish(null);
          if (!store._npHoldAt) store._npHoldAt = Date.now();
          const heldFor = Date.now() - store._npHoldAt;
          if (heldFor < 500) {
            scheduleRecheck(500 - heldFor);
            return finish(store._npHoldSrc);
          }
          store._npHoldSrc = null;
          return finish(null);
        ]]]
    minimized_entity: null
    np_count: 1
    slot_id: null
    src: null
    swap_motion: true
