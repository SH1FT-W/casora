casora_badge_energy_group:
  template: [casora_badge_base, casora_popup_energy]

  show_state: false
  show_label: false
  show_icon: true
  icon: mdi:lightning-bolt

  variables:
    enabled: true
    power_entity: null
    # Which input_select drives the active state (mobile swaps in its filter).
    row_entity: input_select.casora_expanded_row

  entity: input_select.casora_expanded_row

  tap_action:
    action: call-service
    service: input_select.select_option
    service_data:
      entity_id: input_select.casora_expanded_row
      option: >
        [[[
          return states['input_select.casora_expanded_row']?.state === 'energy'
            ? 'none' : 'energy';
        ]]]

  # hold_action comes from casora_popup_energy (this room's energy popup).
  double_tap_action:
    action: none

  styles:
    card:
      - background: >
          [[[
            return states[variables.row_entity]?.state === 'energy'
              ? 'var(--badge-active-color, rgba(255,255,255,0.85))'
              : 'var(--badge-background, rgba(10,12,14,0.65))';
          ]]]
      - display: >
          [[[
            const ev = variables?.enabled;
            const enabled = (ev === undefined || ev === null) ? true :
              (typeof ev === 'boolean') ? ev :
              (typeof ev === 'number') ? ev !== 0 :
              !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());
            return enabled ? 'inline-grid' : 'none';
          ]]]
      - --badge-title-color: >
          [[[
            return states[variables.row_entity]?.state === 'energy' ? 'rgba(0,0,0,0.85)' : 'var(--primary-text-color)';
          ]]]
      - --badge-sub-color: >
          [[[
            return states[variables.row_entity]?.state === 'energy' ? 'rgba(0,0,0,0.6)' : 'var(--secondary-text-color)';
          ]]]
      # A bare yellow glyph washes out on the white selected pill; deepen it there.
      - --casora-badge-energy-medium-color: >
          [[[
            return states[variables.row_entity]?.state === 'energy'
              ? 'var(--casora-color-yellow-dark, #F4C403)'
              : 'var(--casora-color-yellow, #FFCC00)';
          ]]]
      - --casora-badge-icon-color: >
          [[[
            const pid = variables.power_entity || variables.entity_power;
            const w = pid ? parseFloat(states[pid]?.state) : NaN;
            if (!Number.isFinite(w)) return 'var(--casora-badge-energy-color, #30D158)';
            if (w >= Number(variables.extreme_threshold ?? 3000)) return 'var(--casora-badge-energy-very-high-color, #FF4245)';
            if (w >= Number(variables.heavy_threshold   ?? 1000)) return 'var(--casora-badge-energy-high-color, #FF9230)';
            if (w >= Number(variables.normal_threshold  ?? 200))  return 'var(--casora-badge-energy-medium-color, #FFD600)';
            return 'var(--casora-badge-energy-low-color, #30D158)';
          ]]]
      - --icon-primary-color: var(--casora-badge-icon-color)
      - --paper-item-icon-color: var(--casora-badge-icon-color)
      - --state-icon-color: var(--casora-badge-icon-color)

    icon:
      - color: var(--casora-badge-icon-color)

  name: >
    [[[
      const eid = variables.power_entity;
      const power = eid ? parseFloat(states[eid]?.state) : NaN;
      let sub = '';
      if (!isNaN(power)) {
        sub = power >= Number(variables.extreme_threshold ?? 3000) ? 'Extreme Usage'
            : power >= Number(variables.heavy_threshold   ?? 1000) ? 'Heavy Usage'
            : power >= Number(variables.normal_threshold  ?? 200)  ? 'Normal'
            : 'Idle';
      }
      return `
        <div class="badge-wrap">
          <div class="badge-title">Energy</div>
          ${sub ? `<div class="badge-sub">${sub}</div>` : ''}
        </div>
      `;
    ]]]

  extra_styles: >
    [[[
      const ev = variables?.enabled;
      const enabled = (ev === undefined || ev === null) ? true :
        (typeof ev === 'boolean') ? ev :
        (typeof ev === 'number') ? ev !== 0 :
        !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());
      const URL = window.casoraIconUrl('energy');

      return `:host{display:${enabled ? 'inline-block' : 'none'} !important;order:var(--casora-badge-order-energy,6);}
        #img-cell, .img-cell{ position: relative; }

        #img-cell #icon, .img-cell #icon{
          color: transparent !important;
          opacity: 0 !important;
        }

        #img-cell::before,
        .img-cell::before{
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--casora-badge-icon-color, var(--casora-badge-energy-color, #30D158)) !important;
          -webkit-mask: url('${URL}') no-repeat center / auto 82%;
          mask: url('${URL}') no-repeat center / auto 82%;
          transform: translateZ(0);
        }`;
    ]]]
