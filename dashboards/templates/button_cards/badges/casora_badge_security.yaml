casora_badge_security:
  template: [casora_badge_base]

  show_state: false
  show_label: false
  show_icon: true

  variables:
    enabled: true
    label: null
    icon_size: null

  tap_action:
    action: more-info
  hold_action:
    action: more-info
  double_tap_action:
    action: none

  # Carrier only - extra_styles hides #icon and masks the real glyph onto #img-cell::before.
  icon: mdi:lock

  styles:
    card:
      - display: >
          [[[
            const v = variables?.enabled;
            const enabled = (v === undefined || v === null) ? true :
              (typeof v === 'boolean') ? v :
              (typeof v === 'number') ? v !== 0 :
              !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());
            const st = String(entity?.state ?? '').trim().toLowerCase();
            const dead = !entity?.entity_id || !st || ['unknown','unavailable'].includes(st);
            return (!enabled || dead) ? 'none' : 'inline-grid';
          ]]]
      - --casora-badge-icon-color: var(--casora-badge-security-color, #00c3d0)
      - --icon-primary-color: var(--casora-badge-icon-color)
      - --paper-item-icon-color: var(--casora-badge-icon-color)
      - --state-icon-color: var(--casora-badge-icon-color)

    icon:
      - color: var(--casora-badge-icon-color)

  name: >
    [[[
      const esc = (t) => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      const id  = String(entity?.entity_id || '');
      const dom = id.split('.')[0];
      const s   = String(entity?.state || '').toLowerCase();
      const dc  = String(entity?.attributes?.device_class || '').toLowerCase();

      const title = variables?.label || entity?.attributes?.friendly_name || 'Security';

      let sub = '';
      if (dom === 'lock') {
        sub = s === 'locked' ? 'Locked' : s === 'unlocked' ? 'Unlocked' : 'Jammed';
      } else if (dom === 'alarm_control_panel') {
        sub = s === 'disarmed' ? 'Disarmed'
            : s === 'triggered' ? 'Triggered'
            : s === 'armed_home' ? 'Armed Home'
            : s === 'armed_away' ? 'Armed Away'
            : 'Armed';
      } else if (dom === 'camera') {
        /* "Idle" is every camera, all day, so it says nothing. Fall through to the
           same alert wording the aggregated camera badge uses. */
        const alert = window.casoraCameraAlert
          ? window.casoraCameraAlert(hass, states, [id], variables?.alert_window_minutes) : '';
        sub = s === 'recording' ? 'Recording'
            : s === 'streaming' ? 'Live'
            : (alert || 'No Alerts');
      } else if (dom === 'cover') {
        sub = s === 'closed' ? 'Closed' : 'Open';
      } else if (dc === 'motion') {
        sub = s === 'on' ? 'Motion' : 'Clear';
      } else {
        sub = s === 'on' ? 'Open' : 'Closed';
      }

      return `
        <div class="badge-wrap">
          <div class="badge-title">${esc(title)}</div>
          <div class="badge-sub">${esc(sub)}</div>
        </div>
      `;
    ]]]

  extra_styles: >
    [[[
      const v = variables?.enabled;
      const enabled = (v === undefined || v === null) ? true :
        (typeof v === 'boolean') ? v :
        (typeof v === 'number') ? v !== 0 :
        !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());
      const st = String(entity?.state ?? '').trim().toLowerCase();
      const dead = !entity?.entity_id || !st || ['unknown','unavailable'].includes(st);

      const dom = String(entity?.entity_id || '').split('.')[0];
      const dc = String(entity?.attributes?.device_class || '').toLowerCase();
      const isDoor = dc === 'door' || dc === 'opening';
      let name = 'lock';
      if (dom === 'camera') name = 'doorbell';
      else if (dom === 'lock') name = st === 'locked' ? 'lock-fill' : 'lock-open-fill';
      else if (dom === 'binary_sensor' || dom === 'cover') {
        const open = st === 'on' || st === 'open';
        name = isDoor ? (open ? 'door-open' : 'door-closed') : (open ? 'lock-open' : 'lock');
      }
      const URL = window.casoraIconUrl(name);
      const RAW = variables?.icon_size || '72%';
      const SIZE = (isDoor && dom !== 'lock' && /%\s*$/.test(RAW))
        ? (parseFloat(RAW) * 0.944).toFixed(1) + '%'
        : RAW;

      return `:host{display:${(!enabled || dead) ? 'none' : 'inline-block'} !important;}
        #img-cell, .img-cell{ position: relative; }

        #img-cell #icon, .img-cell #icon{
          color: transparent !important;
          opacity: 0 !important;
        }

        #img-cell::before,
        .img-cell::before{
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--casora-badge-icon-color, var(--casora-badge-security-color, #00c3d0)) !important;
          -webkit-mask: url('${URL}') no-repeat center / auto ${SIZE};
          mask: url('${URL}') no-repeat center / auto ${SIZE};
          transform: translateZ(0);
        }`;
    ]]]
