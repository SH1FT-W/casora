# Casora - configuration.yaml reference
# ============================================================================
# Casora needs nothing in configuration.yaml: the integration creates its
# helpers, designs, resources and dashboards itself. Installing Casora without
# the integration is no longer supported. `frontend: themes:` is only needed
# for a theme you copy and change yourself (docs/ADVANCED.md).
# ============================================================================

homeassistant:
  packages: !include_dir_named packages

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include sensors.yaml
