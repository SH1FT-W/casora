# Kartenwünsche (1.5): Einreichungen kommen als vorausgefülltes Issue aus dem Studio. Labels im Link
# übernimmt GitHub nur für Mitglieder – daher erkennt diese Action den Wunsch am Titel und setzt das
# Label selbst. Sicherheit: Issue-Inhalte gehen nur über Umgebungsvariablen in den Schritt.
name: Community
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  einordnen:
    runs-on: ubuntu-latest
    steps:
      - name: Kartenwunsch markieren
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          case "$TITLE" in
            "Kartenwunsch:"*)
              gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --add-label kartenwunsch || true ;;
          esac
