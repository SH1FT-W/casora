scenario:
  fields:
    name:
      required: true
      example: drucker_druckt
      selector:
        select:
          options:
            - drucker_druckt
            - drucker_heizt
            - drucker_abgebrochen
            - waesche_laeuft
            - trockner_laeuft
            - geschirrspueler_laeuft
            - sauger_reinigt
            - alarm_ausgeloest
reset:
live_lauf:
  name: Live-Testlauf
  description: Spielt an einem Testgerät einen Durchgang durch (Start → Fortschritt → Fertig → aus), für Live-Aktivitäten.
  fields:
    geraet:
      required: true
      example: waschmaschine_a
      selector:
        select:
          options:
            - waschmaschine_a
            - waschmaschine_b
            - geschirrspueler
            - trockner
            - sauger
            - drucker
    sekunden:
      required: false
      example: 90
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
live_stopp:
  name: Live-Testlauf anhalten
  description: Bricht laufende Testläufe ab.
