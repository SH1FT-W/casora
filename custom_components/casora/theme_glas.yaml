# Casora Glas – Casora mit Milchglas: Kacheln, Badges, Leisten, Menüs und Popups halbtransparent
# mit backdrop-filter über den Raumfotos statt deckender Leinen-/Creme-Flächen.
# Baut auf dem fertigen Casora-Theme auf (casora-theme-base, wie Nebel): Aufbau, soft-Zweig
# (casora-popup-layout: soft), Akzent- und Statusfarben, Schrift, Radien bleiben Casora.
# Hier stehen nur Flächen, Ränder, Schatten und Blur. Hell = helles Glas, dunkel = dunkles Glas.
# Stufe 2b (17.10.2026, nach Design-Review): deutlich mehr Glas als die erste Fassung – hell Flächen .50
# (aktiv .72), dunkel .32 (aktive Creme-Kacheln bleiben .80, sonst wird die Schrift darauf grau), Blur
# Kacheln 30 / Flächen 40 / Popup 42, Glaskante mit 1-px-Lichtkante und leichtem Glanz oben (≤ .20).
# Lesbarkeit: Zustandstext auf hellem Glas in Espresso (#3A322B) mit Gewicht 600, aktiv dunkel kräftiger.
Casora Glas:
  casora-theme-base: Casora

  # --- Blur: echtes Milchglas statt Hauch (Casora: 6–14 px) ---
  ha-card-backdrop-filter: blur(30px) saturate(1.65)
  ha-dialog-surface-backdrop-filter: blur(42px) saturate(1.65)
  casora-surface-backdrop: blur(40px) saturate(165%)
  casora-glass-backdrop: blur(40px) saturate(165%)
  casora-pill-backdrop: blur(30px) saturate(1.65)
  casora-sidebar-backdrop: blur(34px) saturate(1.4)
  casora-scrim-backdrop: blur(8px)
  badge-blur: 26px
  # Glaskante: feine helle Linie innen, 1-px-Lichtkante oben, leichter Glanz (Casora: none)
  casora-glass-rim: inset 0 0 0 .5px rgba(255,255,255,0.45), inset 0 1px 0 rgba(255,255,255,0.65), inset 0 22px 30px -24px rgba(255,255,255,0.20)
  casora-tile-glass-rim: inset 0 0 0 .5px rgba(255,255,255,0.45), inset 0 1px 0 rgba(255,255,255,0.65), inset 0 22px 30px -24px rgba(255,255,255,0.20)
  casora-tile-glass-rim-desktop: inset 0 0 0 .5px rgba(255,255,255,0.45), inset 0 1px 0 rgba(255,255,255,0.65), inset 0 22px 30px -24px rgba(255,255,255,0.20)
  # Kachelstatus kräftiger (Casora 500): auf klarem Glas sonst zu dünn
  casora-entity-state-weight: 600
  # Studio-Vorschau (casora-panel.js): Milchglas auf den Vorschau-Flächen, im Leistungsmodus ohne Blur
  # und deckend. Die Vorschau ist verkleinert (~0,6), darum etwa 0,6 × der Dashboard-Blur.
  casora-studio-glass-backdrop: blur(18px) saturate(1.65)
  casora-studio-perf-backdrop: none
  casora-studio-perf-tile: var(--casora-perf-tile-fill)
  casora-studio-perf-card: var(--casora-perf-card-fill)
  casora-studio-perf-active: var(--casora-perf-tile-active-fill)
  card-mod-theme: Casora Glas
  uix-theme: Casora Glas

  modes:
    light:
      # Helles Glas: Weiß mit Leinen-Stich, Schrift bleibt Casora-Espresso
      ha-card-background: rgba(255,253,250,0.50)
      ha-card-background-active: rgba(255,253,250,0.72)
      badge-background: rgba(255,253,250,0.50)
      badge-active-color: rgba(255,253,250,0.80)
      casora-entity-background: rgba(255,253,250,0.50)
      # Kachelstatus in Text 1 statt Text 2: auf Glas über hellen Fotostellen sonst < 4,5 : 1
      casora-entity-state: "#3A322B"
      casora-entity-background-active: rgba(255,253,250,0.72)
      casora-entity-active-tint: rgba(255,253,250,0.72)
      casora-entity-active-tint-mobile: rgba(255,253,250,0.74)
      casora-entity-hover-tint: rgba(255,253,250,0.30)
      casora-icon-circle-bg: rgba(90,70,50,0.12)
      # Leisten, Kapsel, Pillen
      casora-nav-bg: rgba(255,253,250,0.50)
      casora-pill-fill: rgba(255,253,250,0.50)
      casora-chrome-fill: rgba(255,253,250,0.50)
      casora-chrome-fill-hover: rgba(255,253,250,0.62)
      casora-nav-active-fill: rgba(255,253,250,0.58)
      casora-nav-tab-active-fill: rgba(255,253,250,0.90)
      casora-mnav-bg: rgba(255,253,250,0.50)
      casora-mnav-press-fill: rgba(255,253,250,0.70)
      casora-room-head-fill: rgba(255,253,250,0.50)
      # Menüs und Fenster (Glocke, ⋯, Räume/Szenen)
      casora-menu-pane: rgba(252,249,245,0.50)
      casora-menu-pane-webkit: rgba(252,249,245,0.58)
      casora-mnav-menu-bg: rgba(252,249,245,0.50)
      casora-mnav-over: rgba(252,249,245,0.62)
      # Popups: Glasblatt, Zeilen als hellere Glasplatten
      casora-dialog-bg: rgba(250,247,242,0.70)
      casora-popup-row-fill: rgba(255,255,255,0.48)
      casora-soft-row-active: rgba(255,255,255,0.86)
      mdc-dialog-scrim-color: rgba(60,48,38,0.18)
      casora-sidebar-fill: rgba(250,247,242,0.60)
      app-header-background-color: rgba(250,247,242,0.50)
      # Schleier hinter Titel und Kacheln etwas leichter, das Foto soll durch das Glas wirken
      hero-wash: >-
        linear-gradient(90deg, rgba(244,239,231,0.62) 0%, rgba(244,239,231,0.28) 38%, rgba(244,239,231,0) 62%),
        linear-gradient(0deg, rgba(244,239,231,0.55) 0%, rgba(244,239,231,0.18) 34%, rgba(244,239,231,0) 55%)
      # Foto weniger verschleiert (Casora: Leinen 40 % über allem) – sonst wirkt das Glas wie Leinen
      hero-tint: rgba(244,236,224,0.12)
      casora-filter-veil: rgba(244,239,231,0.04)
      casora-wallpaper-veil-light: "linear-gradient(to bottom, rgba(244,239,231,0.50) 0%, rgba(244,239,231,0.30) 34%, rgba(244,239,231,0) 50%)"
      casora-wallpaper-veil-light-wide: "linear-gradient(to right, rgba(244,239,231,0.50) 0%, rgba(244,239,231,0.18) 45%, rgba(244,239,231,0) 75%)"
      casora-mobile-hero-tint-top: rgba(244,239,231,0.48)
      casora-mobile-hero-tint-bot: rgba(244,239,231,0.30)
      # Glaskante: helle Linie innen + 1-px-Lichtkante + leichter Glanz oben + Casora-Ruheschatten
      # (Kacheln, Badges, Leisten, Platten über --button-card-box-shadow / --casora-pill-rim)
      casora-shadow-rest: inset 0 0 0 .5px rgba(255,255,255,0.95), inset 0 1px 0 rgba(255,255,255,0.75), inset 0 24px 32px -24px rgba(255,255,255,0.20), 0 1px 2px rgba(90,70,50,0.06), 0 10px 26px -12px rgba(90,70,50,0.22)
      casora-shadow-raised: inset 0 0 0 .5px rgba(255,255,255,1), inset 0 1px 0 rgba(255,255,255,0.85), inset 0 24px 32px -24px rgba(255,255,255,0.20), 0 2px 4px rgba(90,70,50,0.06), 0 18px 40px -14px rgba(120,85,50,0.32)
      casora-shadow-float: inset 0 0 0 .5px rgba(255,255,255,0.90), inset 0 1px 0 rgba(255,255,255,0.60), 0 40px 90px -30px rgba(90,65,40,0.40), 0 10px 28px rgba(90,70,50,0.10)
      # Leistungsmodus (Effekte „Schnell“): ohne Blur deckend wie Casora statt klarem Glas.
      # Kacheln/Badges/Pillen/Seitenleiste nehmen Casoras casora-perf-*-fill; diese hier ersetzt
      # casora-core.js (_casoraPerf) nur, wenn ein Theme sie setzt.
      casora-perf-nav-fill: var(--casora-perf-card-fill)
      casora-perf-chrome-fill: var(--casora-perf-card-fill)
      casora-perf-mnav-fill: var(--casora-perf-card-fill)
      casora-perf-head-fill: var(--casora-perf-sidebar-fill)
      casora-perf-tile-active-fill: rgb(255,253,249)
    dark:
      # Dunkles Glas: warmes Anthrazit halbtransparent, aktiv Creme-Glas (bleibt .80 – darunter wird
      # die dunkle Schrift auf der Creme über dem dunklen Foto grau, gemessen 3,0 : 1 bei .68)
      ha-card-background: rgba(30,27,24,0.32)
      ha-card-background-active: rgba(242,232,218,0.80)
      badge-background: rgba(30,27,24,0.32)
      badge-active-color: rgba(242,232,218,0.80)
      casora-entity-background: rgba(30,27,24,0.32)
      casora-entity-background-active: rgba(242,232,218,0.80)
      casora-entity-active-tint: rgba(240,229,214,0.78)
      casora-entity-active-tint-mobile: rgba(242,232,218,0.80)
      casora-entity-hover-tint: rgba(240,229,214,0.26)
      # Zustandstinte auf der aktiven Creme-Kachel kräftiger als Casora (112,76,48): Glas-Creme ist dunkler
      casora-entity-state-active: rgba(79,53,34,0.96)
      casora-entity-state-active-color: rgba(79,53,34,0.96)
      casora-icon-circle-bg: rgba(255,240,220,0.12)
      casora-nav-bg: rgba(30,27,24,0.32)
      casora-pill-fill: rgba(30,27,24,0.32)
      casora-chrome-fill: rgba(30,27,24,0.32)
      casora-chrome-fill-hover: rgba(60,55,50,0.50)
      casora-nav-active-fill: rgba(255,240,220,0.20)
      casora-mnav-bg: rgba(30,27,24,0.32)
      casora-mnav-press-fill: rgba(255,240,220,0.22)
      casora-room-head-fill: rgba(30,27,24,0.34)
      casora-menu-pane: rgba(34,31,28,0.50)
      casora-menu-pane-webkit: rgba(34,31,28,0.58)
      casora-mnav-menu-bg: rgba(34,31,28,0.50)
      casora-mnav-over: rgba(34,31,28,0.60)
      casora-dialog-bg: rgba(30,27,24,0.62)
      casora-popup-row-fill: rgba(255,240,220,0.09)
      mdc-dialog-scrim-color: rgba(0,0,0,0.25)
      casora-sidebar-fill: rgba(30,27,24,0.55)
      app-header-background-color: rgba(30,27,24,0.45)
      hero-wash: >-
        linear-gradient(90deg, rgba(36,33,30,0.55) 0%, rgba(36,33,30,0.22) 38%, rgba(36,33,30,0) 62%),
        linear-gradient(0deg, rgba(36,33,30,0.55) 0%, rgba(36,33,30,0.18) 34%, rgba(36,33,30,0) 55%)
      hero-tint: rgba(28,24,21,0.30)
      casora-filter-veil: rgba(28,24,21,0.18)
      # Glaskante in Creme: Linie innen + 1-px-Lichtkante + Hauch Glanz, sonst verschwimmen Leiste und Badges im dunklen Foto
      casora-shadow-rest: inset 0 0 0 .5px rgba(255,240,220,0.28), inset 0 1px 0 rgba(255,240,220,0.20), inset 0 24px 32px -24px rgba(255,240,220,0.08), 0 8px 20px -10px rgba(0,0,0,0.55)
      casora-shadow-raised: inset 0 0 0 .5px rgba(255,240,220,0.32), inset 0 1px 0 rgba(255,240,220,0.24), inset 0 24px 32px -24px rgba(255,240,220,0.10), 0 14px 32px -12px rgba(0,0,0,0.60)
      casora-shadow-float: inset 0 0 0 .5px rgba(255,240,220,0.22), inset 0 1px 0 rgba(255,240,220,0.14), 0 40px 90px -30px rgba(0,0,0,0.70), 0 10px 28px rgba(0,0,0,0.30)
      casora-perf-nav-fill: var(--casora-perf-card-fill)
      casora-perf-chrome-fill: var(--casora-perf-card-fill)
      casora-perf-mnav-fill: var(--casora-perf-card-fill)
      casora-perf-head-fill: var(--casora-perf-sidebar-fill)
      casora-perf-tile-active-fill: rgb(242,232,218)
