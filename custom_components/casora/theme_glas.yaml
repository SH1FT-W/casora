# Casora Glas – Casora mit Milchglas: Kacheln, Badges, Leisten, Menüs und Popups halbtransparent
# mit backdrop-filter über den Raumfotos statt deckender Leinen-/Creme-Flächen.
# Baut auf dem fertigen Casora-Theme auf (casora-theme-base, wie Nebel): Aufbau, soft-Zweig
# (casora-popup-layout: soft), Akzent- und Statusfarben, Schrift, Radien bleiben Casora.
# Hier stehen nur Flächen, Ränder, Schatten und Blur. Hell = helles Glas, dunkel = dunkles Glas.
Casora Glas:
  casora-theme-base: Casora

  # --- Blur: echtes Milchglas statt Hauch (Casora: 6–14 px) ---
  ha-card-backdrop-filter: blur(24px) saturate(1.6)
  ha-dialog-surface-backdrop-filter: blur(36px) saturate(1.6)
  casora-surface-backdrop: blur(36px) saturate(160%)
  casora-glass-backdrop: blur(28px) saturate(160%)
  casora-pill-backdrop: blur(24px) saturate(1.6)
  casora-sidebar-backdrop: blur(28px) saturate(1.4)
  casora-scrim-backdrop: blur(6px)
  badge-blur: 20px
  # Feine Lichtkante oben wie Glas (Casora: none)
  casora-glass-rim: inset 0 0 0 .5px rgba(255,255,255,0.22)
  casora-tile-glass-rim: inset 0 0 0 .5px rgba(255,255,255,0.22)
  casora-tile-glass-rim-desktop: inset 0 0 0 .5px rgba(255,255,255,0.22)
  card-mod-theme: Casora Glas
  uix-theme: Casora Glas

  modes:
    light:
      # Helles Glas: Weiß mit Leinen-Stich, Schrift bleibt Casora-Espresso
      ha-card-background: rgba(255,253,250,0.62)
      ha-card-background-active: rgba(255,253,250,0.80)
      badge-background: rgba(255,253,250,0.62)
      badge-active-color: rgba(255,253,250,0.88)
      casora-entity-background: rgba(255,253,250,0.66)
      # Kachelstatus eine Stufe dunkler als Casora-Text 2: auf Glas über dunklen Fotostellen sonst < 4,5 : 1
      casora-entity-state: "#4A4037"
      casora-entity-background-active: rgba(255,253,250,0.84)
      casora-entity-active-tint: rgba(255,253,250,0.82)
      casora-entity-active-tint-mobile: rgba(255,253,250,0.84)
      casora-entity-hover-tint: rgba(255,253,250,0.40)
      casora-icon-circle-bg: rgba(90,70,50,0.12)
      # Leisten, Kapsel, Pillen
      casora-nav-bg: rgba(255,253,250,0.60)
      casora-pill-fill: rgba(255,253,250,0.60)
      casora-chrome-fill: rgba(255,253,250,0.60)
      casora-chrome-fill-hover: rgba(255,253,250,0.75)
      casora-nav-active-fill: rgba(255,253,250,0.70)
      casora-nav-tab-active-fill: rgba(255,253,250,0.95)
      casora-mnav-bg: rgba(255,253,250,0.60)
      casora-mnav-press-fill: rgba(255,253,250,0.80)
      casora-room-head-fill: rgba(255,253,250,0.62)
      # Menüs und Fenster (Glocke, ⋯, Räume/Szenen)
      casora-menu-pane: rgba(252,249,245,0.72)
      casora-menu-pane-webkit: rgba(252,249,245,0.78)
      casora-mnav-menu-bg: rgba(252,249,245,0.72)
      casora-mnav-over: rgba(252,249,245,0.80)
      # Popups: Glasblatt, Zeilen als hellere Glasplatten
      casora-dialog-bg: rgba(250,247,242,0.84)
      casora-popup-row-fill: rgba(255,255,255,0.62)
      casora-soft-row-active: rgba(255,255,255,0.92)
      mdc-dialog-scrim-color: rgba(60,48,38,0.18)
      casora-sidebar-fill: rgba(250,247,242,0.70)
      app-header-background-color: rgba(250,247,242,0.60)
      # Schleier hinter Titel und Kacheln etwas leichter, das Foto soll durch das Glas wirken
      hero-wash: >-
        linear-gradient(90deg, rgba(244,239,231,0.62) 0%, rgba(244,239,231,0.28) 38%, rgba(244,239,231,0) 62%),
        linear-gradient(0deg, rgba(244,239,231,0.55) 0%, rgba(244,239,231,0.18) 34%, rgba(244,239,231,0) 55%)
      # Foto weniger verschleiert (Casora: Leinen 40 % über allem) – sonst wirkt das Glas wie Leinen
      hero-tint: rgba(244,236,224,0.12)
      casora-filter-veil: rgba(244,239,231,0.04)
      casora-wallpaper-veil-light: "linear-gradient(to bottom, rgba(244,239,231,0.50) 0%, rgba(244,239,231,0.30) 34%, rgba(244,239,231,0) 50%)"
      casora-wallpaper-veil-light-wide: "linear-gradient(to right, rgba(244,239,231,0.50) 0%, rgba(244,239,231,0.18) 45%, rgba(244,239,231,0) 75%)"
      casora-mobile-hero-tint-top: rgba(244,239,231,0.48)
      casora-mobile-hero-tint-bot: rgba(244,239,231,0.30)
      # Glaskante: feine helle Linie innen + Casora-Ruheschatten
      casora-shadow-rest: inset 0 0 0 .5px rgba(255,255,255,0.70), 0 1px 2px rgba(90,70,50,0.05), 0 8px 22px -12px rgba(90,70,50,0.18)
      casora-shadow-raised: inset 0 0 0 .5px rgba(255,255,255,0.80), 0 2px 4px rgba(90,70,50,0.06), 0 18px 40px -14px rgba(120,85,50,0.32)
    dark:
      # Dunkles Glas: warmes Anthrazit halbtransparent, aktiv Creme-Glas
      ha-card-background: rgba(30,27,24,0.58)
      ha-card-background-active: rgba(242,232,218,0.92)
      badge-background: rgba(30,27,24,0.55)
      badge-active-color: rgba(242,232,218,0.86)
      casora-entity-background: rgba(30,27,24,0.62)
      casora-entity-background-active: rgba(242,232,218,0.93)
      casora-entity-active-tint: rgba(240,229,214,0.92)
      casora-entity-active-tint-mobile: rgba(242,232,218,0.93)
      casora-entity-hover-tint: rgba(240,229,214,0.30)
      casora-icon-circle-bg: rgba(255,240,220,0.12)
      casora-nav-bg: rgba(30,27,24,0.50)
      casora-pill-fill: rgba(30,27,24,0.50)
      casora-chrome-fill: rgba(30,27,24,0.50)
      casora-chrome-fill-hover: rgba(60,55,50,0.65)
      casora-nav-active-fill: rgba(255,240,220,0.16)
      casora-mnav-bg: rgba(30,27,24,0.55)
      casora-mnav-press-fill: rgba(255,240,220,0.18)
      casora-room-head-fill: rgba(30,27,24,0.62)
      casora-menu-pane: rgba(34,31,28,0.72)
      casora-menu-pane-webkit: rgba(34,31,28,0.80)
      casora-mnav-menu-bg: rgba(34,31,28,0.72)
      casora-mnav-over: rgba(34,31,28,0.80)
      casora-dialog-bg: rgba(30,27,24,0.78)
      casora-popup-row-fill: rgba(255,240,220,0.07)
      mdc-dialog-scrim-color: rgba(0,0,0,0.25)
      casora-sidebar-fill: rgba(30,27,24,0.70)
      app-header-background-color: rgba(30,27,24,0.60)
      hero-wash: >-
        linear-gradient(90deg, rgba(36,33,30,0.55) 0%, rgba(36,33,30,0.22) 38%, rgba(36,33,30,0) 62%),
        linear-gradient(0deg, rgba(36,33,30,0.55) 0%, rgba(36,33,30,0.18) 34%, rgba(36,33,30,0) 55%)
      hero-tint: rgba(28,24,21,0.30)
      casora-filter-veil: rgba(28,24,21,0.18)
      # Glaskante: feine helle Linie innen, sonst verschwimmen Leiste und Badges im dunklen Foto
      casora-shadow-rest: inset 0 0 0 .5px rgba(255,240,220,0.16), 0 6px 16px -10px rgba(0,0,0,0.45)
      casora-shadow-raised: inset 0 0 0 .5px rgba(255,240,220,0.20), 0 14px 32px -12px rgba(0,0,0,0.55)
