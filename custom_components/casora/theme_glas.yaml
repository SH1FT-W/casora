# Casora Glas – dunkles, getöntes Glas über den Raumfotos (der Look des früheren „Hemma 2“).
# Nur die Abweichungen von den Grundwerten (theme.yaml); helfer.py legt sie beim Laden darüber.
# Die Grundwerte SIND das Glas: Kacheln/Badges/Leisten/Popups durchscheinend mit backdrop-filter
# (ha-card-backdrop-filter, casora-surface-backdrop, casora-glass-backdrop, badge-blur …) in beiden Modi.
# Bewusst KEIN casora-popup-layout: soft – ohne den Schalter rendern Vorlagen und Popups den Glas-Zweig
# (Glasplatten statt Creme-Sheet). Von Casora kommen nur Schrift, Radien, Abstände und Bewegung (Tokens).
Casora Glas:
  # --- Schrift: Inter wie Casora, Raumtitel kräftig und eng ---
  primary-font-family: '"Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif'
  casora-body-font: var(--primary-font-family)
  casora-hero-title-weight: 800
  hero-title-letter-spacing-desktop: -3px
  hero-title-letter-spacing-tablet: -2px
  hero-title-letter-spacing-mobile: -1.6px
  casora-entity-name-weight: 700
  casora-entity-state-weight: 500
  casora-entity-state-font-desktop: var(--casora-fs-value)
  casora-entity-state-font-tablet: var(--casora-fs-value)
  casora-entity-state-font-tablet-lg: var(--casora-fs-value)
  casora-entity-name-font-mobile: var(--casora-fs-row)
  casora-entity-state-font-mobile: var(--casora-fs-sub)
  casora-entity-text-line-height: 1.3
  casora-clock-font-size: 16px

  # --- Rundungen wie Casora (Glas-Grundwerte: Kachel 28, Szenen 26, Dialog 28) ---
  ha-card-border-radius: var(--casora-r-surface)
  casora-scene-tile-radius: var(--casora-r-surface)
  casora-tile-radius-phone: var(--casora-r-surface)
  casora-popup-radius: var(--casora-r-window)
  casora-popup-row-radius: var(--casora-r-row)
  ha-dialog-border-radius: 36px
  ha-border-radius-lg: 18px
  wa-border-radius-m: 28px
  # Symbolkreis ringsum gleich (dk-05) und Innenabstände im 4er-Raster wie Casora
  casora-tile-icon-mt-desktop: 0px
  casora-entity-inner-pad-tablet: var(--casora-space-5)
  casora-entity-inner-pad-mobile: 10px
  casora-mobile-chip-gap: var(--casora-space-2)
  badge-gap-mobile: var(--casora-mobile-chip-gap, 8px)
  badge-min-height-mobile: 40px   # AB-03: Tippfläche ≥ 40 px

  # --- Glas: Milchglas etwas kräftiger als die Grundwerte, damit Schrift auf hellen Fotostellen trägt ---
  ha-card-backdrop-filter: blur(24px) saturate(1.3)
  casora-surface-backdrop: blur(30px) saturate(190%)
  ha-dialog-surface-backdrop-filter: blur(28px) saturate(1.3)

  # --- Designsprache (Tokens) – gleiche Werte wie Casora (theme_weich.yaml, docs/handbuch/design-regeln.md § 0) ---
  casora-r-window: 44px
  casora-r-surface: 32px
  casora-r-row: 24px
  casora-r-element: 18px
  casora-r-small: 12px
  casora-r-pill: 999px
  casora-space-1: 4px
  casora-space-2: 8px
  casora-space-3: 12px
  casora-space-4: 16px
  casora-space-5: 20px
  casora-space-6: 24px
  casora-space-8: 32px
  casora-space-10: 40px
  casora-fs-label: 12px
  casora-fs-sub: 13px
  casora-fs-value: 14px
  casora-fs-row: 15px
  casora-fs-heading: 17px
  casora-fs-title: 28px
  casora-fs-page: 34px
  casora-font-studio: '"Casora Studio Inter", "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif'
  casora-ic-head: 56px
  casora-ic-head-phone: 48px
  casora-ic-tile: 44px
  casora-ic-row: 36px
  casora-ic-badge: 28px
  casora-ic-button: 48px
  casora-ic-status: 22px
  casora-ease-enter: cubic-bezier(.2,.8,.3,1)
  casora-dur-enter: 320ms
  casora-ease-slide: cubic-bezier(.36,0,.16,1)
  casora-dur-slide: 360ms
  casora-dur-feedback: 160ms
  casora-ease-feedback: ease
  casora-press-scale: .97
  casora-nav-indicator-ease: var(--casora-ease-slide)
  casora-nav-indicator-duration: var(--casora-dur-slide)
  casora-badge-flip-ease: var(--casora-ease-slide)
  casora-badge-flip-dur: var(--casora-dur-slide)
  casora-badge-enter-ease: var(--casora-ease-enter)

  card-mod-theme: Casora Glas
  uix-theme: Casora Glas
