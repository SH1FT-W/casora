# Casora (früher Casora Weich) – Entwurf „Hell & weich“ (theme_weich.yaml).
# Nur die Abweichungen vom Casora-Theme; helfer.py legt sie beim Laden darüber (wie theme_glass.yaml).
# Idee: Leinen/Sand statt dunkles Glas, kaum Blur, große Rundungen, warme weiche Schatten.
# Dunkel: warmes Anthrazit (#24211E) statt kaltem Schwarz, aktive Kacheln in Creme.
Casora:
  # --- Schrift: Inter (Plus Jakarta Sans entfernt, 02.10.2026) ---
  primary-font-family: '"Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif'
  # Raumtitel wie im Entwurf: kräftiger und enger
  casora-hero-title-weight: 800
  hero-title-letter-spacing-desktop: -3px
  hero-title-letter-spacing-tablet: -2px
  hero-title-letter-spacing-mobile: -1.6px

  # --- Grundfarben gedämpft: Honig, Salbei-Petrol, Ton statt Neon ---
  casora-color-blue: "#5B8FC9"
  casora-color-teal: "#4E9E95"
  casora-color-mint: "#5BA896"
  casora-color-mint-dark: "#68B5A2"
  casora-color-yellow: "#E8B04A"
  casora-color-yellow-dark: "#DCA43E"
  casora-color-green: "#6AAE78"
  casora-color-orange: "#DE8A4E"
  casora-color-red: "#D35A4E"
  casora-color-deep-orange: "#C8693F"
  casora-color-pink: "#D16E7E"
  # --- Abfallarten (Tonnen-Symbol, Kalenderpunkte, Kachel am Abholtag), 05.10.2026 ---
  # Wie im Abfall-Popup (Weich-Farben der Tonnen), jetzt auch für Kachel und Kalender.
  # Restmüll war dort ein halb durchsichtiges Braungrau; hier deckend je Modus (siehe
  # modes), damit Kreis und Symbol auf jedem Grund gleich aussehen. Sperrmüll und
  # Problemstoffe bekommen eigene Farben statt beide Orange.
  casora-waste-bio: var(--casora-color-green)
  casora-waste-paper: var(--casora-color-blue)
  casora-waste-glass: var(--casora-color-teal)
  casora-waste-yellow: var(--casora-color-yellow)
  casora-waste-bulky: var(--casora-color-orange)
  casora-waste-hazard: var(--casora-color-red)
  casora-waste-other: var(--casora-color-orange)
  casora-waste-glyph: "#FFFFFF"
  casora-color-neutral: "#C9BFB2"
  casora-soft-grey-mark: rgba(120,100,80,0.8)   # iOS-Grau aus Daten (Tonnen, Diagramme) im Look-Ton
  primary-color: "#B67A50"          # Ton/Terrakotta als HA-Akzent
  state-light-on-color: rgb(232,176,74)
  state-on-color: rgb(78,158,149)
  state-icon-active-color: rgb(78,158,149)

  # --- Rundungen: überall großzügiger ---
  ha-card-border-radius: 32px
  ha-dialog-border-radius: 36px
  casora-scene-tile-radius: 30px
  # Szenen-Knöpfe (casora_scene_core) wie die übrigen Weich-Kacheln (04.10.2026): dunkle Schrift,
  # Symbol im Kreis – aus neutral, aktiv in der Szenenfarbe mit hellem Symbol.
  casora-scene-off-name: var(--casora-entity-name)
  casora-scene-off-icon: var(--casora-soft-glyph-off)
  casora-scene-icon-circle: 1
  casora-scene-icon-box: 40px
  casora-scene-glyph: 22px
  casora-scene-name-weight: 700
  # Chip-Reihen am Handy (Raum-Chips Temperatur/Luftfeuchtigkeit/Licht, Klima/Sicherheit/Energie):
  # Pillen mit gleichmäßig 8 px Abstand (Standard ohne Pillen: 16 px).
  casora-mobile-chip-gap: 8px
  wa-border-radius-m: 28px
  ha-border-radius-lg: 18px
  # Nicht in theme.yaml, aber vom Code mit Fallback gelesen (casora-core.js/smart-row.js):
  casora-popup-radius: 44px
  casora-popup-row-radius: 24px
  # Lange Popups (Batterien, Jalousien): unten 36px Luft und ein Verlauf in Sheet-Farbe statt dunkel (Audit M3)
  casora-popup-content-pad-bottom: 36px
  casora-popup-more-fade: var(--casora-dialog-bg)
  casora-tile-radius-phone: 30px

  # --- Wenig Glas: Blur nur noch als Hauch ---
  ha-card-backdrop-filter: blur(10px) saturate(1.05)
  ha-dialog-surface-backdrop-filter: blur(8px) saturate(1.05)
  casora-surface-backdrop: blur(14px) saturate(115%)
  casora-scrim-backdrop: blur(4px)
  casora-glass-backdrop: blur(10px) saturate(110%)
  casora-pill-backdrop: blur(8px) saturate(1.05)
  casora-sidebar-backdrop: blur(10px)
  badge-blur: 6px
  casora-tile-glass-rim: none
  casora-tile-glass-rim-desktop: none
  casora-glass-rim: none
  # Raumleiste/Kopf-Pille wie im Entwurf: keine Glanzkante, feine Sandlinie + weicher Schatten
  casora-pill-highlight: none
  casora-pill-edge: transparent

  # --- Hero-Foto: weicher, minimal entsättigt ---
  hero-img-blur: 5px
  hero-img-saturate: 0.94
  card-mod-theme: Casora
  uix-theme: Casora
  # Popup-Aufbau wie im Weich-Entwurf (Ring, Titel, zwei Spalten). Lesen die Popups per
  # getComputedStyle(documentElement); Standard und Glas setzen ihn nicht.
  # Popup-Bausteine (_casoraUI, casora-popup) in der Weich-Gestaltung: Ring-Kopf, Sand-Pillen,
  # Großbuchstaben-Etiketten. Ohne diesen Schalter bleibt alles wie in Standard/Glas.
  casora-popup-layout: soft

  # --- Fix-Runde 1 A: globale Tokens (Schrift, Skalen, Palette) ---
  # A-01: HA setzt body fest auf Roboto; casora-core.js liest diesen Wert global (Fallback = HA-Wert).
  casora-body-font: var(--primary-font-family)
  # A-12: Palette schließen – keine Neon-Reste, keine Zusatzfarben (Lila/Indigo/Gold)
  casora-color-purple: "#A9473D"        # extreme Warnung: dunkles Alarm-Rot statt Lila
  # Lila nur für Szenen (keine Warnfarbe): gedämpftes Violett, eigener Schlüssel – purple bleibt Dunkelrot.
  casora-color-violet: "#7E6A9E"
  casora-color-deep-blue: "#4A7DB5"     # sehr kalt: dunkles Kühl
  casora-color-gold: var(--casora-color-yellow-dark)
  casora-color-ice: var(--casora-color-blue)
  casora-color-amber: var(--casora-color-orange)
  casora-badge-temp-comfortable-color: var(--casora-color-teal)
  casora-badge-temp-warm-color: var(--casora-color-orange)
  # Sicherheit = Rot (Farbsystem, wie Studio) als Akzent für Popups/Studio
  casora-security-accent: var(--casora-color-red)
  casora-badge-alert-color: var(--casora-color-red)
  # Sicherheits-Badges (Sicherheit, Schlösser, Kameras, Türen/Fenster, Alarm) nach Zustand
  # (Stufe aus window.casoraSecurityLevel, 00-finden.js; die große Badge = schlimmster Zustand):
  #   ok    Grün   – verriegelt, geschlossen, Alarm scharf, Kamera online
  #   warn  Orange – entriegelt, offen, gekippt, Alarm unscharf, Gerät offline
  #   alarm Rot    – Alarm ausgelöst, Schloss klemmt, offen/entriegelt bei Abwesenheit
  # Standard/Glas setzen diese Variablen nicht und behalten ihre bisherigen Farben.
  casora-security-ok-color: var(--casora-color-green)
  casora-security-warn-color: var(--casora-color-orange)
  casora-security-alarm-color: var(--casora-color-red)
  # Schloss-Kachel/Popup-Ring entriegelt: dieselbe Warnfarbe wie Badge „1 entriegelt“ (Standard/Glas: Türkis)
  casora-lock-unlocked-color: var(--casora-security-warn-color)
  casora-scene-badge-color: var(--casora-color-yellow)
  casora-scene-badge-color-active: var(--casora-color-yellow-dark)
  # Kopfleiste D (1.0.7): Zähler und Punkt der Glocke in Karamell statt Rot
  casora-bell-badge: var(--primary-color)
  casora-bell-dot-fill: var(--primary-color)
  casora-bell-count-ink: "#fff"
  casora-badge-energy-medium-color: var(--casora-color-green)
  casora-badge-energy-medium-row: var(--casora-color-green)
  casora-badge-energy-medium-selected: var(--casora-color-green)
  # Energie-Unter-Badges (Solar/Akku/Haus/Netz …): eingestellte iOS-Farben (energy_color_N) → Weich-Töne,
  # gleiche Zuordnung wie _casoraSoftColor (Lila → Türkis, Palette ohne Lila). Färbt auch den Popup-Ring.
  casora-energy-sub-yellow: var(--casora-color-yellow)
  casora-energy-sub-blue: var(--casora-color-blue)
  casora-energy-sub-purple: var(--casora-color-teal)
  casora-energy-sub-red: var(--casora-color-red)
  casora-energy-sub-green: var(--casora-color-green)
  casora-energy-sub-orange: var(--casora-color-orange)
  casora-energy-sub-teal: var(--casora-color-teal)
  # A-06: Kachel-Typo – Name 700, Status 500 und kleiner
  casora-entity-name-weight: 700
  casora-entity-state-weight: 500
  casora-entity-state-font-desktop: calc(var(--casora-u, 10px) * 1.45)
  # Tablet (07.10.2026): Zustände 14 px statt 12,5/13 – am iPad las sich Kleingedrucktes schwer.
  casora-entity-state-font-tablet: 14px
  casora-entity-state-font-tablet-lg: 14px
  casora-entity-name-font-mobile: 14px
  casora-entity-state-font-mobile: 12px
  casora-entity-text-line-height: 1.3
  # A-11: Uhr ruhiger; 05.10.2026 minimal größer (15 → 16) passend zum größeren Hero-Wetter
  casora-clock-font-size: 16px
  casora-clock-letter-spacing: 0px
  casora-clock-transform: none
  # A-09: Raumleiste 14/600, Pfeil-Kreis, Verlauf endet vor dem Pfeil
  casora-nav-label-size-tablet: 14px
  casora-nav-label-pad-x-tablet: 14px
  # D-14: breitere Ausblendung + Einrasten auf Raumanfänge – keine Wortreste („ur“) neben dem Pfeil
  casora-nav-fade-solid: 104px
  casora-nav-fade-clear: 40px
  # D-09 (06.10.2026): kein Ring – nur bei Tastatur ist die Schrift unterstrichen
  casora-nav-focus-line: var(--casora-ton-ink)
  casora-nav-more-fill: var(--casora-nav-active-fill)
  casora-nav-more-hover: var(--casora-mnav-press-fill, var(--casora-nav-active-fill))
  casora-nav-more-ink: var(--casora-nav-label-color)
  casora-nav-chevron: var(--casora-text-2)
  casora-back-hit: -2px   # D-03: Zurück-Knopf sichtbar 40 px, Trefferfläche 44 px
  casora-lpc-pill-pad-m: 14px 15px   # D-03: Raumfilter im Licht-Popup am Handy 44 px hoch (vorher 39)
  casora-lpc-row-inset: 14px   # D-17: Raumfilter beginnt auf der Inhaltskante der Zeilen darunter
  casora-climate-seg-h: 58px   # D-06: Modusknöpfe im Thermostat so hoch wie die Zeilen daneben
  casora-weather-precip-fs: 12px   # D-18: Regen-% im Wetter-Popup 12 statt 11 px
  casora-mobile-np-title-size: 17px   # D-12: „Aktuelle Wiedergabe“ so groß wie „Favoriten“
  casora-category-title-weight: 800   # D-12: Kategorie-Titel („Klima“) wie Seitentitel „Zuhause“
  # Kachelreihe (smart-row): Pfeil links/rechts, solange dort noch Kacheln liegen (Audit H2)
  casora-row-arrows: block
  # Wie die Reihe zeigt, dass es weitergeht: arrows (Pfeile) | fade (Ausblenden + Punkte) | more („+N weitere“)
  casora-row-overflow: fade
  # A-04/A-05: Badges mit Symbolkreis, kleiner, Ruhe-Schatten S1
  casora-badge-circle-mix: 100%
  casora-badge-circle-on: 1
  casora-badge-glyph-scale: 0.58
  badge-gap: calc(var(--casora-u-badge, 10px) * 0.8)
  badge-col-gap: calc(var(--casora-u-badge, 10px) * 0.8)
  # Handy: Badge-Reihe der Startseite mit demselben Abstand wie die Raum-Chips (vorher 10 px
  # aus dem Grund-Theme, in den Räumen 8 px).
  badge-gap-mobile: var(--casora-mobile-chip-gap, 8px)
  badge-padding: calc(var(--casora-u-badge, 10px) * 0.5) calc(var(--casora-u-badge, 10px) * 1.6) calc(var(--casora-u-badge, 10px) * 0.5) calc(var(--casora-u-badge, 10px) * 0.6)
  badge-min-height: calc(var(--casora-u-badge, 10px) * 4.1)
  badge-font-size: calc(var(--casora-u-badge, 10px) * 1.4)
  badge-sub-scale: 0.88   # D-12: Badge-Unterzeile am Handy 11 px (war 10,75)
  badge-sub-delta: 0px
  badge-sub-scale-tablet: 1   # Tablet (07.10.2026): Badge-Unterzeile 13 px (war 11,4)
  badge-col-gap-tablet: 8px
  badge-padding-tablet: 5px 14px 5px 5px
  badge-min-height-tablet: 38px
  badge-col-gap-mobile: 7px
  badge-padding-mobile: 5px 14px 5px 5px
  badge-min-height-mobile: 36px
  badge-font-size-mobile: 12.5px
  # Symbolkreis so hoch wie Titel+Unterzeile (15 + 1 + 12,9 px): sonst bestimmt der Text die
  # Pillenhöhe (38,9) und der 26-px-Kreis sitzt oben/unten 6,4, links aber 5 px vom Rand.
  # Mit 29 px gilt rundum 5 px wie am Desktop; Pillen mit nur einer Zeile werden gleich hoch.
  badge-icon-size-mobile: 29px
  casora-badge-glass-rim: var(--button-card-box-shadow)
  casora-badge-shadow-mobile: var(--button-card-box-shadow-mobile)
  # Handy-Unterreihen (Klima-Ring-Badges): Pille mit Ruhe-Schatten wie die Haupt-Badges
  casora-badge-gauge-shadow: var(--button-card-box-shadow-mobile)
  casora-badge-clip: none
  casora-badge-off-tone: var(--casora-icon-circle-bg)
  casora-badge-off-glyph: var(--casora-soft-glyph-off)
  casora-badge-media-tone: var(--casora-tone-media)
  # Farbsystem der Symbole (Nutzerwunsch 2): feste Bedeutung je Ton, nur Gerätefarben.
  #   light    Gelb   – Licht, Szenen, Stimmung
  #   general  Türkis – Bedienung, Allgemeines, Räume (Primärakzent)
  #   energy   Grün   – Energie, Pflanzen, OK, Zeitreise/Versionen
  #   heat     Orange – Heizung, Wetter, Uhrzeit
  #   alert    Rot    – Sicherheit, Alarm, Mitteilungen
  #   media    Blau   – Netzwerk, Medien, Updates
  #   settings Sand   – Einstellungen, Design, Darstellung
  # Sand je Modus (unten), gleiche Werte wie casora-studio-icon-neutral (Fix-Runde 1 C)
  casora-tone-light: var(--casora-color-yellow)
  casora-tone-general: var(--casora-color-teal)
  casora-tone-energy: var(--casora-color-green)
  casora-tone-heat: var(--casora-color-orange)
  casora-tone-alert: var(--casora-color-red)
  casora-tone-media: var(--casora-color-blue)
  casora-tone-settings: var(--casora-color-sand)
  # Diagramm-Serien (Download/Upload u. a.): Weich-Töne statt der iOS-Fallbacks #64D2FF/#BF5AF2
  casora-series-1: var(--casora-tone-media)
  casora-series-2: var(--casora-tone-general)
  # Menüs (Navbar Räume/Szenen, ⋯-Menü, Raumleisten-Menü): Symbol im Ton auf 14-%-Kreis, Zeilen 44 hoch
  casora-menu-tone-mix: 100%
  casora-menu-ic-display: flex
  # Kopfleiste D (1.0.7): Symbolkreise 32 mit leichter Tönung, Zeilen 44, Radius 24
  casora-menu-ic-size: 32px
  casora-menu-ic-fill: 12%
  casora-menu-ic-col: 32px
  casora-menu-ic-gap: 12px
  casora-menu-row-h: 44px
  casora-menu-row-pad: 0 16px 0 7px
  casora-menu-item-pad: 6px 16px 6px 8px
  # Räume-/Szenen-Menü der Handy-Leiste (07.10.2026): Markierung der offenen Zeile ringsum gleich
  # weit vom Menürand, Ecken konzentrisch zur Menü-Rundung (Handy-Radius minus Abstand), Symbolkreis
  # links so weit von der Kante wie vom Text (12 px = casora-menu-ic-gap).
  casora-mnav-menu-pad: 8px
  casora-mnav-item-radius: calc(var(--casora-tile-radius-phone, 30px) - var(--casora-mnav-menu-pad, 8px))
  casora-mnav-item-pad: 0 18px 0 12px
  casora-menu-item-radius: 16px
  casora-menu-radius: 24px
  casora-menu-item-weight: 600
  casora-menu-item-size: 15px   # D-12: ⋯-Menü in derselben Größe wie das Räume-Menü
  casora-menu-item-dim: 1
  casora-menu-icons-filled: 1
  # A-19: Mitteilungen – Zeilen wie Popup-Zeilen, Aktion in Ton
  casora-notify-row-radius: 18px
  casora-notify-pad: 0 8px 8px
  casora-notify-pad-solo-top: 8px
  casora-notify-action: var(--casora-ton-ink)
  # A-22: Handy-Startseite – Titel 34/800, Überschrift 17, Kacheln 62 hoch
  hero-title-size-mobile: 34px
  casora-mobile-title-ls: -1.1px
  casora-mobile-section-size: 17px
  casora-tile-row-h-mobile: 62px
  # Kopfleiste D „Ruhig“ (1.0.7): Desktop-Kreise 40 mit 8 Abstand (mittig zur Raum-Leiste, die
  # Mitte bleibt über casora-chrome-row-center-desktop), Handy-Kapsel 48 hoch, Trennstrich kürzer,
  # Symbole etwas leichter, gleiche helle Fläche mit weichem Schatten (casora-chrome-shadow je Modus).
  casora-chrome-btn-step: 48px
  casora-chrome-btn-size-desktop: 40px
  casora-np-head-size: 40px
  casora-mchrome-h: 48px
  casora-chrome-sep-top: 16px
  casora-chrome-sep-h: 16px
  casora-chrome-glyph-opacity: 0.82
  casora-chrome-backdrop: var(--casora-pill-backdrop)
  casora-pill-divider: color-mix(in srgb, var(--primary-text-color) 12%, transparent)
  # Updates-Popup „Mehr“: Überschrift „KI-Check“ wie „System“ (Funkel-Symbol 16 px macht die Zeile nicht höher)
  casora-upd-ai-head-pad: 4px 4px 10px
  casora-upd-ai-glyph-my: -1px
  casora-upd-ai-head-display: flex
  # A-14: eine Kante – Kacheln, Badges, Uhr auf 352 (Desktop), Titel und Wetter optisch −2
  casora-hero-badge-edge: 2px
  casora-header-temp-nudge: 0px
  casora-time-edge: 2px
  # A-15: Kacheln ohne Entität zeigen den Namen ihrer Vorlage (Alarm, Kamera, Abfall …)
  casora-tile-fallback-name: 1
  # A-16: leerer Raum – dezente Zeile „Noch keine Geräte – im Studio hinzufügen“
  casora-empty-row-display: flex
  casora-empty-row-fill: var(--casora-entity-background)
  casora-empty-row-shadow: var(--button-card-box-shadow)
  # A-12: Symbole inaktiver Kacheln in Aus-Grau (Entwurf: Stehlampe „Aus“)
  casora-icon-off-mix: 100%
  casora-icon-off-ink: var(--casora-soft-glyph-off)
  # --- Runde 2 ---
  # Kachelsymbole nach dem Farbsystem: Medien/Netzwerk/Updates Blau, Pflanzen Grün (kein Pink, kein Gelb).
  casora-tile-media-color: var(--casora-color-pink)   # Medien-Kachel + Popup-Ring rosa-rot wie der Lautstärkebalken (Wunsch 02.10.2026)
  casora-tile-plant-color: var(--casora-tone-energy)
  # Thermostat-Puck aus: derselbe Sandkreis wie jede inaktive Kachel (statt Schwarz 20 %).
  casora-puck-off-bg: var(--casora-icon-circle-bg)
  # Energie-Diagramm in Gerätefarbe Grün (Ring und Linie gleich), Netzwerk bleibt Blau.
  casora-energy-series: var(--casora-tone-energy)
  # Handy-Glocke mit Mitteilung: Punkt in Alarmrot statt mitgefärbtem bell-badge-Symbol.
  casora-bell-dot: 1
  # Popup-Spalten: Etikett-Feld und sein Block ohne Zusatzabstand (Schloss-Schalter bündig mit der Liste)
  casora-col-lbl-gap: 0px
  # Mini-Player oben rechts / „Aktuelle Wiedergabe“ am Handy (casora_now_playing_*, 03.10.2026):
  # Leinen-Karte wie das Mitteilungsmenü statt grauem Glas, Schrift in Ink, Fortschritt im Medien-Ton
  # (wie Medien-Popup), Wiedergabe in Ton. Kopf-Knopf wie die Nachbarn; offen = gedrücktes Sand statt Weiß.
  casora-np-surface: var(--casora-menu-pane)
  casora-np-backdrop: var(--casora-glass-backdrop)
  casora-np-rim: var(--ha-card-box-shadow)
  casora-np-ring: 0
  casora-np-chip-rim: none
  casora-np-scrim: none
  casora-np-bloom: 0
  casora-np-art-fill: var(--casora-soft-control-fill)
  casora-np-art-rim: none
  casora-np-hover: var(--casora-soft-row-hover)
  casora-np-sub: var(--casora-text-2)
  casora-np-track: var(--casora-soft-control-fill)
  # Fortschritt (Balken und Ring) immer in Ton wie der Wiedergabe-Knopf, nicht im Medien-Ton (Variante B, 04.10.2026).
  # Gilt auch fürs Medien-Popup (07-weich-spezial.js) und die Studio-Vorschau; die Cover-Tönung der Karte bleibt.
  casora-np-progress: var(--casora-soft-media-play, #B67A50)
  casora-np-fill: var(--casora-np-progress)
  casora-np-glyph: var(--primary-text-color)
  casora-np-glyph-primary: var(--casora-ton-ink)
  casora-np-press: var(--primary-text-color)
  casora-np-ring-disc: var(--casora-soft-control-fill)
  casora-np-ring-track: var(--casora-popup-progress-track)
  casora-np-ring-fill: var(--casora-np-progress)
  # Wellen-Knopf neben Glocke/Mitteilungen/Mehr: Grund wie die drei anderen Knöpfe (auch aufgeklappt),
  # Wellen im Ton wie Wiedergabe-Knopf und Balken, solange etwas läuft, sonst dunkel (Variante C, 04.10.2026).
  casora-np-head-ink: var(--casora-chrome-ink, rgba(255,255,255,0.90))
  # Aufgeklappt wie die offene Glocke: weißer Grund, dunkles Symbol (04.10.2026).
  casora-np-head-on: "#fff"
  casora-np-head-on-ink: "#000"
  casora-np-head-play-ink: var(--casora-ton-ink)
  # Heizung = Wärme-Orange (Puck, Modus-Symbole); Temperaturleiste in der Weich-Palette statt iOS-Regenbogen
  casora-puck-heat-color: var(--casora-color-orange)
  casora-temp-gradient: "linear-gradient(90deg, #5B8FC9 0%, #4E9E95 32%, #E8B04A 62%, #DE8A4E 82%, #D35A4E 100%)"
  # A-20: aktiver Tab der Handy-Navbar in Ton (Symbol und Beschriftung)
  casora-mnav-icon-on: var(--primary-color)
  casora-mnav-label-on: var(--casora-ton-ink)
  casora-mnav-label-on-weight: 600
  # Handy-Leiste wie die Desktop-Raumleiste (Variante A, 05.10.2026): Fläche, Schatten, Unschärfe und
  # Aktivfeld kommen direkt aus den Desktop-Variablen, damit beide zusammen bleiben. Aktives Ziel als
  # heller Sand mit normaler Schrift statt Ton-Pille; inaktive Symbole wie die Desktop-Beschriftung.
  casora-mnav-pill: var(--casora-nav-active-fill)
  casora-mnav-pill-ink: var(--casora-nav-label-color)
  casora-mnav-pill-weight: var(--casora-chrome-font-weight, 500)
  casora-mnav-fg: var(--casora-nav-label-color)
  casora-mnav-idle-opacity: var(--casora-nav-label-inactive-opacity, 0.84)
  casora-mnav-pane: var(--casora-pill-fill)
  casora-mnav-shadow: var(--casora-pill-rim)
  casora-mnav-blur: var(--casora-pill-backdrop)
  # Menüs aus der Leiste (Räume, Szenen) wie die Menüs der Desktop-Raumleiste: gleiche Fläche und
  # Schatten, normale Schrift, aktiver Eintrag in hellem Sand.
  casora-mnav-menu-pane: var(--casora-menu-pane)
  casora-mnav-menu-shadow: var(--casora-elevation-floating, 0 8px 20px rgba(0,0,0,0.13))
  casora-mnav-on-fill: var(--casora-nav-active-fill)
  casora-mnav-fg-on: var(--casora-menu-fg, #fff)
  # D-12: Räume-Menü wie das ⋯-Menü (15 px / 600, aktiv 700) statt 15/400
  casora-mnav-item-weight: 600
  casora-mnav-item-on-weight: 700
  # A-07: Kachelabstand Desktop/Tablet (war 16), Handy-Raster (Standard 8) – minimal enger
  casora-tile-row-gap-desktop: 12px
  casora-tile-row-gap-mobile: 8px
  # Handy-Raum: Abstand Badge-Reihe -> erste Kachelreihe (Standard 24px), 5x Kachelraster
  casora-room-badges-gap-mobile: 40px
  # A-03: Kachel-Schalter wie im Licht-Popup (gefüllte Spur, weißer Knopf)
  casora-toggle-style: solid
  casora-toggle-hover-filter: brightness(1.04)
  # A-08/A-17: inaktive Kacheln mit Ruhe-Schatten S1, Hover nur über den Schatten (kein Farbschleier)
  casora-tile-rest-shadow-desktop: var(--button-card-box-shadow)
  casora-tile-rest-shadow: var(--button-card-box-shadow-mobile)
  casora-tile-hover-shadow: var(--button-card-box-shadow-hover)
  casora-hover-overlay-opacity: 0
  # A-10: Wetter im Hero – Symbol in Textfarbe, Temperatur 24
  hero-weather-temp-size: 24px
  weather-icon-size-desktop: 26px
  weather-icon-size-tablet: 24px
  # Hero-Wetter Desktop/Tablet größer (Stufe C, 05.10.2026): Temperatur 34/30, Symbol 29/26, daneben
  # zweizeilig Zustand (14/12,5) und „H · T · Regen“ aus der Tagesvorhersage (12/10,5). Nur im
  # Casora-Look; ohne diese Variablen (Hemma 1/2) bleibt es bei Temperatur 24 + Symbol (casora_weather).
  # Studio → Wetter → „Details anzeigen“ schaltet die Textspalte ab (Größen bleiben).
  casora-hero-weather-details: "1"
  casora-hero-weather-temp-size-desktop: 34px
  casora-hero-weather-temp-size-tablet: 30px
  casora-hero-weather-icon-desktop: 29px
  casora-hero-weather-icon-tablet: 26px
  casora-hero-weather-cond-size-desktop: 14px
  casora-hero-weather-cond-size-tablet: 14px   # 07.10.2026: war 12,5
  casora-hero-weather-sub-size-desktop: 12px
  casora-hero-weather-sub-size-tablet: 13px   # 07.10.2026: war 10,5
  casora-hero-weather-glyph-gap: 5px
  casora-hero-weather-text-gap-desktop: 9px
  casora-hero-weather-text-gap-tablet: 8px
  # Der Wetter-Slot hängt oben fest; der höhere Inhalt (34 statt 26 px) wächst nach oben statt
  # Richtung Titel (Standard in theme.yaml: Faktor −2,2).
  weather-hero-widget-position-nudge: calc(var(--casora-u-weather, 10px) * -2.2 - 8px)

  modes:
    light:
      # Flächen + Text: Leinen-Grund, Espresso-Schrift
      primary-background-color: rgb(244,239,231)
      secondary-background-color: rgb(236,229,218)
      primary-text-color: "#3A322B"
      text-primary-color: rgba(58,50,43,0.95)
      # D-11: deckend – auf der leicht durchscheinenden Kachel kam „Aus“ sonst nur auf ~3,7 : 1
      secondary-text-color: "#62574C"
      # Fix-Runde 1 A-13: genau ein Text-2- und ein Text-3-Wert; alle Varianten verweisen darauf
      casora-text-2: var(--secondary-text-color)
      casora-text-3: rgba(58,50,43,0.45)
      # Ton als Schriftfarbe (Aktionen, aktiver Tab): dunkler als #B67A50, damit Text ≥ 4.5:1 hat
      casora-ton-ink: "#94603B"
      casora-color-sand: "#9A8672"
      disabled-text-color: rgba(138,125,112,0.65)
      sidebar-text-color: "#5C5047"
      ha-card-background: rgba(251,248,243,0.88)
      ha-card-background-active: rgba(255,253,249,1)
      badge-background: rgba(251,248,243,0.84)
      badge-title-inactive: rgba(58,50,43,0.90)
      # Aktive Sammel-Badges: gedrücktes Sand wie die aktive Navigation (Schrift dort fest dunkel)
      badge-active-color: rgba(230,214,194,0.96)
      # Badge-Unterzeile ohne zusätzliche Abdunklung, sonst unter 4.5:1 auf Creme
      casora-badge-sub-opacity: 1
      hero-tint: rgba(244,236,224,0.40)
      # Creme-Verlauf über dem Foto (wie im Entwurf): links hinter dem Raumnamen, unten hinter den Kacheln
      hero-wash: >-
        linear-gradient(90deg, rgba(244,239,231,0.78) 0%, rgba(244,239,231,0.38) 38%, rgba(244,239,231,0) 62%),
        linear-gradient(0deg, rgba(244,239,231,0.92) 0%, rgba(244,239,231,0.30) 34%, rgba(244,239,231,0) 55%)
      hero-img-brightness-mobile: 1.02
      casora-icon-circle-bg: rgba(140,115,90,0.12)
      scrollbar-thumb-color: rgba(90,70,50,0.18)
      # D-11: Symbole inaktiver Kacheln mindestens 3 : 1 (0.40 lag bei ~2 : 1)
      state-icon-color: rgba(58,50,43,0.62)
      state-off-color: rgba(58,50,43,0.30)

      # Handy-Hintergrund: Leinen-Schleier von oben bis knapp unter „Favoriten“ (Lesbarkeit von Titel,
      # Badges und Überschrift), darunter das Foto klar bis ganz unten – kein Leinen unten (05.10.2026, 1.0.9).
      casora-mobile-hero-tint-top: rgba(244,239,231,0.62)
      casora-mobile-hero-tint-bot: rgba(244,239,231,0.50)
      casora-mobile-hero-wash-mid: 34%
      casora-mobile-hero-wash-end: 50%
      casora-mobile-hero-height: 100%
      casora-mobile-hero-c-handoff: rgba(244,239,231,0)
      casora-mobile-hero-c-upper: rgba(244,239,231,0)
      casora-mobile-hero-c-mid: rgba(244,239,231,0)
      casora-mobile-hero-c-lower: rgba(244,239,231,0)
      casora-mobile-hero-c-base: rgba(244,239,231,0)
      casora-mobile-hero-floor: "#F4EFE7"

      # Kacheln: inaktiv Sand, aktiv Creme mit warmem Schatten
      casora-entity-background: rgba(240,233,223,0.82)
      casora-entity-background-active: rgba(255,253,249,1)
      casora-entity-active-tint: rgba(255,252,246,0.97)
      casora-entity-active-tint-mobile: rgba(255,252,246,1)
      casora-entity-hover-tint: rgba(255,252,246,0.60)
      casora-entity-name: rgba(58,50,43,0.92)
      casora-entity-name-active: rgba(46,39,33,0.94)
      casora-entity-state: var(--casora-text-2)
      casora-entity-state-active: rgba(132,88,56,0.96)
      casora-entity-state-active-color: rgba(132,88,56,0.96)
      casora-toggle-inactive-opacity: 1
      casora-toggle-track-fill: rgba(58,50,43,0.55)
      casora-toggle-off-color: rgba(58,50,43,0.38)
      # Kamerakachel ohne Standbild (aus/offline): Status in Kachelschrift statt Weiß
      casora-camera-plain-text: var(--casora-entity-state)
      # Kachel-Symbole ohne eigene Farbe (z. B. Abfall): Taupe statt Weiß
      casora-icon-fallback-color: rgba(120,100,80,0.80)
      casora-icon-inactive-fallback-color: var(--casora-icon-fallback-color)
      # Handy-Kategorieansicht (filter-overlay.js): Schleier über dem Foto in Leinen statt Schwarz
      casora-filter-veil: rgba(244,239,231,0.10)
      # Lesbarkeits-Schleier über dem Raumfoto am Handy: von oben bis knapp unter die erste Überschrift
      # kräftig, dann bis 50 % auf 0 – darunter klares Foto (1.0.9)
      casora-wallpaper-veil-light: "linear-gradient(to bottom, rgba(244,239,231,0.66) 0%, rgba(244,239,231,0.52) 34%, rgba(244,239,231,0) 50%)"
      # Desktop/Tablet: nur links hinter Titel, Badges und Überschriften, nach rechts auslaufend
      casora-wallpaper-veil-light-wide: "linear-gradient(to right, rgba(244,239,231,0.65) 0%, rgba(244,239,231,0.30) 45%, rgba(244,239,231,0) 75%)"

      # Navigation, Popups, Bedienelemente
      casora-nav-bg: rgba(251,248,243,0.78)
      casora-nav-label-color: rgba(58,50,43,0.92)
      casora-mobile-title-color: rgba(58,50,43,0.95)
      casora-room-head-fill: rgba(244,239,231,0.94)  # H3 (Weich-Audit): Fläche unter „‹ Raumname“
      casora-chrome-ink: rgba(58,50,43,0.88)
      casora-chrome-fill: rgba(251,248,243,0.80)
      casora-chrome-fill-hover: rgba(240,233,223,0.95)
      # Weisse <img>-Glyphen der Kopfzeilen-Knöpfe (Glocke, Assist) dunkel färben
      casora-chrome-glyph-filter: brightness(0) opacity(0.78)
      # K5 (Weich-Audit): gefüllte Glyphe in Titelfarbe statt blasser Kontur
      casora-hero-weather-glyph-filter: brightness(0) sepia(0.35) opacity(0.9)
      casora-weather-glyph-fill: "1"
      # Handy-Navbar (04-navigation.js): Creme statt dunklem Glas
      casora-mnav-bg: rgba(251,248,243,0.82)
      casora-back-rim: none
      casora-back-highlight: none
      # Menü-Glas (casoraMenuGlass: Navbar, ⋯-Menüs): Creme statt dunkel
      casora-menu-pane: rgba(251,248,243,0.96)
      # Mitteilungszentrum ohne Glas-Rand (Rim oben/unten), weicher Schatten wie die Karten
      casora-notify-shadow: 0 1px 2px rgba(90,70,50,0.06), 0 14px 34px -12px rgba(90,70,50,0.26)
      # D-01: am Handy (WebKit) ganz deckend – 0,97 ließ Text dahinter durchscheinen (Nutzertest 06.10.2026)
      casora-menu-pane-webkit: rgb(248,244,237)
      casora-menu-fg: rgba(46,39,33,0.95)
      # Kopfleiste D (1.0.7): Menü ohne Randlinie und Glanzkante
      casora-menu-rim-top: transparent
      casora-menu-rim-bottom: transparent
      casora-menu-edge: transparent
      casora-mnav-menu-bg: rgba(251,248,243,0.94)
      casora-mnav-over: rgba(246,241,233,0.96)
      casora-mnav-fg-sub: var(--casora-text-2)
      casora-mnav-fg-icon: var(--casora-text-2)
      casora-mnav-press-fill: rgba(220,205,186,0.95)
      casora-nav-border: rgba(120,100,80,0.10)
      casora-nav-active-fill: rgba(232,221,206,0.95)
      casora-pill-fill: rgba(251,248,243,0.80)
      # Kopfleiste D (1.0.7): ohne Randlinie, nur weicher Schatten; Desktop-Kreise gleich
      casora-pill-rim: 0 1px 2px rgba(90,70,50,0.05), 0 8px 24px -16px rgba(90,64,40,0.30)
      casora-chrome-shadow: var(--casora-pill-rim)
      casora-popup-tiles-text-primary: 'rgba(58,50,43,0.95)'
      casora-popup-tiles-text-secondary: var(--casora-text-2)
      casora-popup-tiles-text-muted: var(--casora-text-2)
      # Popup-Bausteine (_casoraUI, casora-core.js): Platten in Creme statt dunklem Glas,
      # Status- und Aktionsfarben dunkler, damit sie auf Creme lesbar bleiben.
      # D-01: deckend (gleiche Mischfarbe wie vorher auf der Popup-Fläche) – sonst schimmert die Seite durch
      casora-popup-row-fill: rgb(254,252,247)
      casora-popup-row-hover: rgba(140,115,90,0.06)
      casora-sheet-row-fill: var(--casora-popup-row-fill)
      casora-sheet-chart-fill: var(--casora-popup-row-fill)
      casora-sheet-plate-shadow: 0 1px 2px rgba(90,70,50,0.05), 0 10px 28px -16px rgba(90,70,50,0.22)
      casora-popup-ui-tertiary: var(--casora-popup-tiles-text-muted)
      casora-popup-ui-fill: rgba(140,115,90,0.08)
      casora-popup-ui-fill-2: rgba(140,115,90,0.14)
      casora-popup-ui-divider: var(--casora-popup-divider)
      casora-popup-ui-dim: "#A6978A"
      # Updates-Popup, KI-Check: neutrale Pille „Offen/Unklar/Fehler“ (Schrift; Grund = 16 % davon → Sand)
      casora-upd-ai-neutral: rgba(92,74,58,0.92)
      casora-popup-ui-bare-glyph: var(--casora-popup-tiles-text-secondary)
      casora-popup-ui-action: "#276B64"
      casora-popup-ui-accent: var(--casora-popup-ui-action)
      casora-popup-ui-good: "#2F7445"
      casora-popup-ui-warn: "#93551A"
      casora-popup-ui-bad: "#B8463A"
      casora-popup-ui-on-ink: rgba(255,253,249,0.98)
      casora-popup-ui-action-tint: rgba(39,107,100,0.10)
      casora-popup-section-ink: var(--casora-popup-tiles-text-primary)
      casora-popup-section-shadow: none
      casora-popup-slider-track: rgba(120,100,80,0.26)
      casora-menu-fg-sub: var(--casora-popup-tiles-text-secondary)
      casora-menu-hover: rgba(140,115,90,0.08)
      casora-glass-pill-fill: rgba(140,115,90,0.12)
      casora-cam-ctl-ink: var(--casora-popup-tiles-text-primary)
      casora-cam-ctl-label: var(--casora-popup-tiles-text-secondary)
      # D-18: dunkler (mit 12 px aus casora-weather-precip-fs) – Regen-% lag knapp unter 4,5 : 1
      casora-weather-precip: "#285F84"
      # Fest weiß gesetzte Popup-Schrift (z. B. Aquarien) über die Popup-Schriftstufen
      casora-sheet-ink: var(--casora-popup-tiles-text-primary)
      casora-sheet-ink-2: var(--casora-popup-tiles-text-secondary)
      casora-sheet-ink-3: var(--casora-popup-tiles-text-muted)
      # Diagramm-Achsen (ApexCharts liest var() auch im SVG-Attribut)
      casora-chart-label: var(--casora-text-3)
      casora-chart-grid: rgba(120,100,80,0.12)
      casora-popup-tiles-fill: rgba(140,115,90,0.07)
      casora-popup-tile-hover: rgba(140,115,90,0.10)
      casora-popup-progress-track: rgba(140,115,90,0.14)
      casora-popup-divider: rgba(120,100,80,0.10)
      casora-control-off: rgba(140,115,90,0.10)
      casora-control-on: rgba(255,253,249,0.95)
      casora-progress-track-color: rgba(140,115,90,0.14)
      casora-sidebar-fill: rgba(244,239,231,0.94)
      app-header-background-color: rgba(244,239,231,0.85)

      # Weiche Schatten statt Glaskanten
      ha-card-box-shadow: 0 1px 2px rgba(90,70,50,0.05), 0 12px 32px -14px rgba(90,70,50,0.22)
      button-card-box-shadow: 0 1px 2px rgba(90,70,50,0.05), 0 8px 22px -12px rgba(90,70,50,0.18)
      button-card-box-shadow-mobile: 0 6px 16px -10px rgba(90,70,50,0.18)
      button-card-box-shadow-active: 0 2px 4px rgba(90,70,50,0.06), 0 18px 40px -14px rgba(120,85,50,0.32)
      button-card-box-shadow-active-mobile: 0 10px 24px -12px rgba(120,85,50,0.30)
      button-card-box-shadow-hover: 0 2px 4px rgba(90,70,50,0.06), 0 16px 34px -14px rgba(90,70,50,0.26)
      button-card-box-shadow-hover-mobile: 0 6px 16px -10px rgba(90,70,50,0.18)
      dialog-box-shadow: 0 40px 90px -30px rgba(90,65,40,0.40), 0 10px 28px rgba(90,70,50,0.10)
      mdc-dialog-scrim-color: rgba(60,48,38,0.26)

      # Dialoge deckend (D-01: bei 0.97 schimmerten Navbar und Seite im Sheet durch)
      casora-dialog-bg: rgb(250,246,240)
      ha-dialog-background: var(--casora-dialog-bg)
      ha-dialog-surface-background: var(--casora-dialog-bg)
      ha-color-fill-primary-quiet-resting: rgba(140,115,90,0.10)
      ha-color-fill-primary-quiet-hover: rgba(140,115,90,0.15)
      # HA-Knöpfe „neutral“ (z. B. nicht gewählte Reiter „Nach Typ“/„Bausteine“ im Dialog
      # „Bedingung hinzufügen“): das Grund-Theme setzt dafür weiße Schrift auf 8 % Weiß – auf
      # Leinen unlesbar (07.10.2026). Hier Espresso-Schrift auf Sand. Casora-Vorlagen nutzen
      # diese Web-Awesome-Werte nicht, nur HAs eigene Bedienelemente.
      wa-color-neutral-on-normal: var(--primary-text-color)
      wa-color-neutral-fill-normal: rgba(140,115,90,0.10)
      mdc-text-field-fill-color: rgba(140,115,90,0.08)
      mdc-select-fill-color: rgba(140,115,90,0.08)
      input-fill-color: rgba(140,115,90,0.08)
      input-ink-color: rgba(58,50,43,0.90)
      input-label-ink-color: var(--casora-text-2)
      casora-perf-dialog-fill: rgb(250,246,240)
      casora-perf-scrim-fill: rgba(60,48,38,0.30)
      casora-perf-tiles-fill: rgba(140,115,90,0.07)
      # Reduzierte Effekte (casora_perf): deckende Ersatzflächen in Sand/Creme statt Anthrazit
      casora-perf-tile-fill: rgb(240,233,223)
      casora-perf-card-fill: rgb(251,248,243)
      casora-perf-pill-fill: var(--casora-perf-card-fill)
      casora-perf-badge-fill: var(--casora-perf-card-fill)
      casora-perf-glass-fill: var(--casora-perf-card-fill)
      casora-perf-sidebar-fill: rgb(244,239,231)

      # --- Licht-Popup (soft) ---
      # casora_popup_light im Weich-Aufbau (window._casoraLightSoft, scripts/local/03-popups.js)
      casora-lps-ring: var(--casora-color-yellow)
      casora-lps-ring-ink: "#FFFFFF"
      casora-lps-ring-halo: rgba(232,176,74,0.16)
      casora-lps-ring-shadow: 0 14px 30px -10px rgba(200,140,40,0.55)
      casora-lps-ring-off: rgba(140,115,90,0.12)
      casora-lps-ring-off-ink: rgba(58,50,43,0.45)
      casora-lps-ring-off-halo: rgba(140,115,90,0.06)
      casora-lps-title: var(--primary-text-color)
      casora-lps-sub: var(--secondary-text-color)
      casora-lps-label: var(--secondary-text-color)
      casora-lps-track: rgba(140,115,90,0.10)
      casora-lps-fill: "linear-gradient(90deg, #F2D08A, #E8B04A)"
      casora-lps-fill-ink: "#3A2A14"
      casora-lps-seg: rgba(140,115,90,0.10)
      casora-lps-seg-ink: var(--secondary-text-color)
      casora-lps-seg-on: rgba(255,253,249,1)
      casora-lps-seg-on-ink: rgba(46,39,33,0.94)
      casora-lps-seg-on-shadow: 0 1px 2px rgba(90,70,50,0.05), 0 8px 22px -12px rgba(90,70,50,0.18)
      casora-lps-dot-warm: "#F2B45C"
      casora-lps-dot-neutral: "#F6DDB0"
      casora-lps-dot-cold: "#E7EEF4"
      casora-lps-dot-ring: rgba(120,100,80,0.22)
      casora-lps-row: rgba(140,115,90,0.07)
      casora-lps-row-hover: rgba(140,115,90,0.11)
      casora-lps-icon-on: var(--casora-color-yellow)
      casora-lps-icon-on-ink: "#FFFFFF"
      casora-lps-icon-off: rgba(140,115,90,0.12)
      casora-lps-icon-off-ink: rgba(58,50,43,0.55)
      casora-lps-switch-off: rgba(58,50,43,0.38)
      casora-lps-switch-on: "#B67A50"
      casora-lps-knob: "#FFFFFF"
      casora-lps-chip: rgba(140,115,90,0.07)
      casora-lps-chip-ink: var(--secondary-text-color)
      casora-lps-chip-on: rgba(232,221,206,0.95)
      casora-lps-chip-on-ink: var(--primary-text-color)
      casora-lps-close-bg: rgba(140,115,90,0.10)
      casora-lps-close-ink: var(--secondary-text-color)
      # --- Soft-Popup-Bausteine ---
      casora-soft-surface: var(--casora-dialog-bg)
      casora-soft-shadow: var(--dialog-box-shadow)
      casora-soft-label: var(--casora-popup-tiles-text-secondary)
      casora-soft-sub: var(--casora-popup-tiles-text-secondary)
      casora-soft-row-fill: rgba(140,115,90,0.07)
      casora-soft-row-hover: rgba(140,115,90,0.11)
      casora-soft-row-press: rgba(140,115,90,0.16)
      casora-soft-plate-fill: rgba(140,115,90,0.05)
      casora-soft-control-fill: var(--casora-control-off)
      casora-soft-icon-off: var(--casora-icon-circle-bg)
      casora-soft-glyph: "#FFFFFF"
      casora-soft-glyph-off: rgba(58,50,43,0.55)
      casora-waste-rest: "#8F7E6D"
      casora-soft-close-ink: var(--casora-popup-tiles-text-secondary)
