# Helpers Casora's cards need. The integration creates them on start (helfer.py) when they
# do not exist yet, as normal UI helpers. The cards' actions are services (actions.py), the
# former scripts are gone from here.
# Formerly packages/casora_helpers.yaml. Whoever still has the package keeps it; existing
# entities are never touched.


input_boolean:
  casora_dashboard_redirect:
    name: Casora Dashboard Redirect
    initial: on

  casora_now_playing_minimized:
    name: Casora Now Playing Minimized
    initial: off

  casora_thermostat_overlay:
    name: Thermostat Overlay
    initial: off

  casora_actions_overlay:
    name: Entity Actions Overlay
    initial: off

  casora_mobile_navigation:
    name: Mobile Navigation
    initial: off

  casora_lock_overlay:
    name: Lock Overlay
    initial: off

  casora_motion_badges:
    name: Motion Badges
    initial: on

  casora_restart_confirm_1:
    name: Network Restart Confirm 1
    initial: off

  casora_restart_confirm_2:
    name: Network Restart Confirm 2
    initial: off

  casora_restart_done_1:
    name: Network Restart Done 1
    initial: off

  casora_restart_done_2:
    name: Network Restart Done 2
    initial: off

input_text:
  # Which Now Playing source is pinned to the primary slot
  casora_now_playing_pinned:
    name: "Casora Now Playing - Pinned"
    initial: ""
    max: 32


  casora_thermostat_active_entity:
    name: "Casora Thermostat - Active Entity"
    initial: ""

  casora_actions_active_entity:
    name: "Casora Entity Actions - Active Entity"
    initial: ""

input_datetime:
  casora_notifications_read:
    name: "Casora Notifications - Last Read"
    has_date: true
    has_time: true

input_number:
  # Einheit/Grenzen setzt helfer.py passend zum Einheitensystem (°C: 15–30, 0,5).
  casora_thermostat_target_temperature:
    name: Thermostat Target Temperature
    min: 68
    max: 75
    step: 1
    unit_of_measurement: "°F"
    mode: slider

# Mobile badge filters
input_select:
  casora_mobile_filter:
    name: Mobile Dashboard Filter
    options:
      - all
      - climate
      - lights
      - presence
      - media
      - security
      - energy
      - room_scenes
    initial: all
    # Raum-Einträge (room_…) ergänzt Casora Studio beim Speichern.

  # Badges row
  casora_expanded_row:
    name: Expanded Badge Row
    options:
      - none
      - climate
      - presence
      - media
      - lights
      - security
      - energy
      - scenes
    initial: none

  # Thermostat mode
  casora_thermostat_mode:
    name: Thermostat Mode
    options:
      - heat
      - cool
    initial: heat
